<!DOCTYPE html>
<!-- RLR · Carreteras de México 1.0 · 2.0 · 3.0 · 4.0 — Ricardo López Reyero -->
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carreteras de México 1.0 · 2.0 · 3.0 · 4.0</title>
<meta name="description" content="La red carretera principal de México trazada sobre OpenStreetMap, con su grosor real por carriles, las versiones 2.0, 3.0 y 4.0 para dejar al país impecablemente conectado, métricas y el plan de obra en orden de valor.">
<meta name="author" content="Ricardo López Reyero">
<meta name="rev" content="181218">
<meta name="build" content="eye">
<meta name="theme-color" content="#001240">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23001240'/%3E%3Cpath d='M22 58 30 6h4l8 52' fill='none' stroke='%2356EF9F' stroke-width='5' stroke-linejoin='round'/%3E%3Cpath d='M32 12v8M32 28v8M32 44v8' stroke='%23ffffff' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* RLR · paleta SuperLeads sobre fondo navy */
:root{
  --navy-deep:#001240; --navy:#002582; --blue:#0039C8; --blue-mid:#2A89FB; --green:#56EF9F;
  --amber:#FFC857; --txt:#ffffff; --txt2:#c3d0ec; --txt3:#a9bbe3; --line:rgba(169,187,227,.22);
  --side:#000c30; --card:rgba(255,255,255,.045); --ease:cubic-bezier(.16,1,.3,1);
  --r2:#6f8bd0; --r4:#cfddff; --r6:#ffffff; --lado:236px; --panel:384px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--navy-deep);color:var(--txt);font-family:"Plus Jakarta Sans",system-ui,-apple-system,Segoe UI,sans-serif;-webkit-font-smoothing:antialiased}
body{overflow:hidden}
button,select,input{font:inherit;color:inherit}

/* ── armazón: barra lateral + contenido ── */
.shell{display:grid;grid-template-columns:var(--lado) minmax(0,1fr);height:100vh;height:100dvh}
.shell.compacta{--lado:72px}
.lado{background:var(--side);border-right:.5px solid var(--line);display:flex;flex-direction:column;min-height:0;position:relative;z-index:20}
.marca{padding:18px 16px;border-bottom:.5px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:76px}
.logo-slot{display:flex;align-items:center;gap:11px;min-width:0;text-decoration:none;color:#fff}
.logo-slot svg{flex:none}
.logo-slot div{min-width:0;line-height:1.1}
.logo-slot b{display:block;font-size:15px;font-weight:800;letter-spacing:-.01em;white-space:nowrap}
.logo-slot span{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--green);font-weight:700;margin-top:3px;white-space:nowrap}
.nav{padding:14px 10px;display:flex;flex-direction:column;gap:3px;flex:1;overflow-y:auto;min-height:0}
.nav-grupo{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:rgba(169,187,227,.6);font-weight:700;padding:12px 13px 6px}
.nav-grupo:first-child{padding-top:2px}
.sec-item{position:relative;display:flex;align-items:center;gap:12px;padding:11px 13px;border-radius:10px;color:var(--txt2);font-size:14px;font-weight:600;
  border:0;background:none;width:100%;text-align:left;cursor:pointer;white-space:nowrap;transition:background .15s,color .15s}
.sec-item svg{flex:none;opacity:.85}
.sec-item:hover{background:rgba(255,255,255,.05);color:#fff}
.sec-item.act{background:rgba(0,57,200,.32);color:#fff}
.sec-item.act svg{opacity:1;color:var(--green)}
.sec-item.act::after,.sec-item.eligiendo::after{content:"";position:absolute;left:-10px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--green)}
.sec-item.eligiendo::after{transform:scaleY(.2);opacity:0;animation:barraEntra .2s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes barraEntra{to{transform:scaleY(1);opacity:1}}
.sec-item .cuenta{margin-left:auto;font-size:11px;font-weight:700;color:var(--txt3);background:rgba(255,255,255,.06);border-radius:999px;padding:1px 8px}
.usuario{border-top:.5px solid var(--line);padding:14px 16px;display:flex;align-items:center;gap:11px}
.avatar{width:36px;height:36px;flex:none;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.07);border:.5px solid var(--line);color:var(--txt3)}
.usuario .info{min-width:0;flex:1}
.usuario .info b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.usuario .info span{display:block;font-size:11.5px;color:var(--txt3);white-space:nowrap}
.usuario .off-btn{flex:none;width:36px;height:36px;border-radius:10px;border:.5px solid var(--line);background:none;display:grid;place-items:center;color:var(--txt3);opacity:.55;cursor:not-allowed}
.plegar{position:absolute;right:-13px;top:88px;width:26px;height:26px;border-radius:50%;border:.5px solid var(--line);background:var(--side);display:grid;place-items:center;cursor:pointer;color:var(--txt3);transition:transform .3s var(--ease),color .2s;z-index:3}
.plegar:hover{color:#fff}
.compacta .plegar{transform:rotate(180deg)}
.compacta .logo-slot div,.compacta .sec-item span,.compacta .sec-item .cuenta,.compacta .nav-grupo,.compacta .usuario .info,.compacta .usuario .off-btn{display:none}
.compacta .marca{justify-content:center;padding:18px 8px}
.compacta .sec-item{justify-content:center;padding:12px 0}
.compacta .usuario{justify-content:center;padding:14px 8px}
.cerrar-movil,.topbar,.velo{display:none}

/* ── contenido ── */
.principal{display:flex;flex-direction:column;min-width:0;min-height:0}
.cabeza{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:14px 22px;border-bottom:.5px solid var(--line);background:linear-gradient(180deg,#001a57,var(--navy-deep))}
.cabeza small{display:block;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--green);font-weight:700}
.cabeza h1{font-size:21px;font-weight:800;letter-spacing:-.02em;line-height:1.2;margin-top:2px}
.cabeza p{font-size:12.5px;color:var(--txt3);margin-top:2px}
#versiones{display:grid;grid-template-columns:repeat(4,86px) 40px;gap:5px;padding:4px;background:rgba(255,255,255,.05);border:.5px solid var(--line);border-radius:14px;flex:none}
#versiones button{border:0;background:none;border-radius:10px;padding:6px 4px 5px;cursor:pointer;line-height:1.1;transition:background .3s var(--ease),transform .2s var(--ease)}
#versiones button b{display:block;font-size:16px;font-weight:800}
#versiones button em{display:block;font-style:normal;font-size:10.5px;color:var(--txt3);margin-top:2px;font-weight:600;white-space:nowrap;letter-spacing:-.01em}
#versiones button:hover{transform:translateY(-2px)}
#versiones button.on{background:var(--blue);box-shadow:0 6px 18px rgba(0,57,200,.45)}
#versiones button.on em{color:#dfe8ff}
#versiones button[data-v="3"].on{background:linear-gradient(135deg,#0039C8,#1a8a6a)}
#versiones button[data-v="4"].on{background:linear-gradient(135deg,#0039C8,#a8801a)}
#play{font-size:15px!important;color:var(--green)!important}
.cabeza.sin-versiones #versiones{display:none}
.cuerpo{flex:1;min-height:0;position:relative}
.vista-mapa{position:absolute;inset:0;display:grid;grid-template-columns:minmax(0,1fr) var(--panel)}
.pagina{position:absolute;inset:0;overflow:auto;padding:22px 26px 60px;display:none;scrollbar-width:thin;scrollbar-color:rgba(169,187,227,.3) transparent}
.modo-pagina .vista-mapa{visibility:hidden}
.modo-pagina .pagina{display:block}
@media(prefers-reduced-motion:no-preference){
  @keyframes entra{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .entrando{animation:entra .3s cubic-bezier(.2,.7,.3,1) both}
  .saliendo{opacity:0;transform:translateY(-6px);transition:opacity .17s ease-in,transform .17s ease-in}
}

/* ── mapa ── */
#mapa-wrap{position:relative;min-width:0;overflow:hidden;background:radial-gradient(120% 90% at 40% 45%,#062a78 0%,#011a57 45%,#001240 100%)}
#mapa{width:100%;height:100%;display:block;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
#mapa.arrastrando{cursor:grabbing}
.vecino{fill:#021c5c;stroke:rgba(169,187,227,.16);stroke-width:.5px;vector-effect:non-scaling-stroke}
.estado{fill:#0a2c7c;stroke:rgba(195,208,236,.20);stroke-width:.5px;vector-effect:non-scaling-stroke}
#mexico{filter:drop-shadow(0 0 18px rgba(42,137,251,.18))}
.rot-mar{fill:rgba(169,187,227,.34);font-style:italic;font-weight:500;letter-spacing:.32em}
.rot-mar2{fill:rgba(169,187,227,.30);font-style:italic;font-weight:500;letter-spacing:.08em}
.rot-pais{fill:rgba(195,208,236,.30);font-weight:700;letter-spacing:.34em}
#marca{fill:rgba(255,255,255,.055);font-weight:800;letter-spacing:-.02em;transition:opacity .6s var(--ease)}
.rot-mar,.rot-mar2,.rot-pais{transition:opacity .4s}
.cerca .rot-mar,.cerca .rot-mar2,.cerca .rot-pais,.cerca #marca{opacity:0}
#sec{fill:none;stroke:rgba(169,187,227,.16);stroke-width:.6px;vector-effect:non-scaling-stroke;stroke-linejoin:round;transition:opacity .4s}
.sin-sec #sec{opacity:0}
.via,.nueva,.halo,.hit{fill:none;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.via,.nueva{transition:stroke-width .9s var(--ease),stroke .6s var(--ease),opacity .4s ease}
.via.viejo{stroke:#8ea4dc!important;stroke-width:.8px!important;stroke-dasharray:2 3;opacity:.55}
#vias{filter:drop-shadow(0 0 1.2px rgba(0,18,64,.95))}
.atenuar .via:not(.foco),.atenuar .nueva:not(.foco){opacity:.16}
.halo{stroke:#fff;opacity:.95}
.halo.proy{stroke:var(--amber);opacity:.55}
.hit{stroke:transparent;stroke-width:11px;pointer-events:stroke;cursor:pointer}
.hit.off{pointer-events:none}
.ciudad circle{fill:#fff;stroke:var(--navy-deep);stroke-width:1.4;cursor:pointer;transition:fill .3s}
.ciudad.chica circle{fill:#dbe5ff}
.ciudad.sel circle{fill:var(--amber)}
.ciudad text{fill:#fff;font-weight:600;paint-order:stroke;stroke:var(--navy-deep);stroke-width:3.2px;stroke-linejoin:round;pointer-events:none;opacity:0;transition:opacity .25s}
.ciudad.l1 text{font-weight:700}
.ciudad text.vis,.ciudad.sel text,.ciudad.hover text{opacity:1}
.ciudad.l3:not(.sel) circle{opacity:.85}
#tip{position:absolute;pointer-events:none;background:rgba(0,18,64,.96);border:.5px solid var(--line);border-radius:12px;padding:10px 12px;font-size:12.5px;line-height:1.45;color:var(--txt2);min-width:220px;max-width:300px;box-shadow:0 12px 32px rgba(0,0,0,.35);opacity:0;transform:translateY(4px);transition:opacity .15s,transform .15s;z-index:5;backdrop-filter:blur(12px)}
#tip.on{opacity:1;transform:none}
#tip b{color:#fff;font-weight:700}
#tip .t1{font-size:14px;color:#fff;font-weight:700;margin-bottom:2px}
#tip .fila{display:grid;grid-template-columns:34px 1fr auto;gap:8px;align-items:center;margin-top:3px}
#tip .fila i{display:block;height:6px;border-radius:3px;background:var(--r4)}
#tip .fila.act span{color:#fff;font-weight:700}
#ctrl-zoom{position:absolute;right:14px;top:14px;display:flex;flex-direction:column;gap:6px;z-index:3}
#ctrl-zoom button{width:36px;height:36px;border-radius:10px;border:.5px solid var(--line);background:rgba(0,18,64,.82);backdrop-filter:blur(12px);font-size:18px;font-weight:600;cursor:pointer;transition:transform .2s var(--ease),background .2s}
#ctrl-zoom button:hover{transform:translateY(-2px);background:rgba(0,37,130,.95)}
#leyenda{position:absolute;left:14px;bottom:14px;z-index:3;background:rgba(0,18,64,.82);backdrop-filter:blur(14px);border:.5px solid var(--line);border-radius:14px;padding:12px 14px;font-size:12.5px;color:var(--txt2);max-width:calc(100% - 28px)}
#leyenda h4{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--txt3);font-weight:700;margin-bottom:8px}
.ley-carr{display:flex;gap:12px;align-items:flex-end;margin-bottom:10px}
.ley-carr div{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11.5px}
.ley-carr svg{display:block}
.ley-col{display:flex;gap:14px;flex-wrap:wrap}
.ley-col span{display:flex;align-items:center;gap:6px;white-space:nowrap}
.ley-col i{width:18px;height:4px;border-radius:2px;display:inline-block}
#escala{position:absolute;right:14px;bottom:14px;z-index:3;font-size:11px;color:var(--txt3);text-align:right}
#escala div{height:6px;border:1.5px solid var(--txt3);border-top:0;margin-top:3px}
#credito{position:absolute;right:14px;bottom:44px;font-size:10.5px;color:rgba(169,187,227,.7);z-index:3}
#credito a{color:inherit}
#ayuda-mapa{position:absolute;left:50%;top:14px;transform:translateX(-50%);z-index:3;font-size:12px;color:var(--txt2);background:rgba(0,18,64,.72);border:.5px solid var(--line);border-radius:999px;padding:6px 14px;backdrop-filter:blur(10px);white-space:nowrap;transition:opacity .4s}

/* ── panel de la sección (a la derecha del mapa) ── */
#panel{background:linear-gradient(180deg,#001a57 0%,var(--navy-deep) 100%);border-left:.5px solid var(--line);overflow:auto;padding:18px 20px 40px;min-height:0;scrollbar-width:thin;scrollbar-color:rgba(169,187,227,.3) transparent}
.p-tit{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--txt3);font-weight:700;margin:18px 0 8px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.p-tit:first-child{margin-top:0}
.p-tit em{font-style:normal;letter-spacing:0;text-transform:none;font-weight:600}
.desc{font-size:13.5px;line-height:1.55;color:var(--txt2)}
.desc b{color:#fff}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kpi{background:var(--card);border:.5px solid var(--line);border-radius:12px;padding:10px 12px}
.kpi .n{font-size:21px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.kpi .n small{font-size:12px;font-weight:600;color:var(--txt3);margin-left:3px}
.kpi .e{font-size:12px;color:var(--txt3);margin-top:3px;line-height:1.3}
.kpi .d{font-size:11.5px;font-weight:700;margin-top:4px;color:var(--green)}
.kpi .d:empty{display:none}
.caja{background:var(--card);border:.5px solid var(--line);border-radius:12px;padding:12px 14px}
.vbar{display:grid;grid-template-columns:30px 1fr 118px;gap:8px;align-items:center;margin-top:5px;font-size:12.5px;color:var(--txt2)}
.vbar i{display:block;height:8px;border-radius:4px;background:rgba(169,187,227,.35);transition:width .8s var(--ease)}
.vbar.act i{background:var(--green)}
.vbar.act span{color:#fff;font-weight:700}
.vbar b{font-weight:800;color:#fff;font-size:12px}
.vbar span{text-align:right;white-space:nowrap}
.vbar.clic{cursor:pointer}
.vbar.clic:hover b{color:var(--green)}
.item{display:block;width:100%;text-align:left;background:var(--card);border:.5px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:7px;cursor:pointer;transition:transform .25s var(--ease),border-color .25s,background .25s}
.item:hover{transform:translateY(-2px);border-color:rgba(169,187,227,.45)}
.item.on{border-color:var(--amber);background:rgba(255,200,87,.08)}
.item .t{font-size:13.5px;font-weight:700;color:#fff;display:flex;gap:8px;align-items:baseline}
.item .t i{flex:0 0 auto;width:9px;height:9px;border-radius:3px;display:inline-block;transform:translateY(1px)}
.item .r{font-size:12.5px;color:var(--txt2);line-height:1.4;margin-top:3px}
.item .m{font-size:11.5px;color:var(--txt3);margin-top:5px;font-weight:600}
.item .s{display:inline-block;margin-top:6px;font-size:11px;font-weight:700;color:var(--amber);background:rgba(255,200,87,.1);border:.5px solid rgba(255,200,87,.35);border-radius:999px;padding:2px 8px}
.item.paso{padding:7px 10px}
.item.paso .t{font-size:12.5px}
.item.hecho{opacity:.62}
.sub{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--txt3);font-weight:700;margin:10px 0 7px}
.sub.anio{color:var(--green)}
.plegable{margin-top:14px}
.plegable summary{cursor:pointer;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--txt3);font-weight:700;margin-bottom:7px;list-style:none}
.plegable summary::-webkit-details-marker{display:none}
.plegable summary::after{content:" ↓"}
.plegable[open] summary::after{content:" ↑"}
.banda{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.banda div{background:rgba(0,18,64,.55);border:.5px solid var(--line);border-radius:10px;padding:8px 9px}
.banda b{display:block;font-size:16px;font-weight:800}
.banda span{font-size:11px;color:var(--txt3)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:.5px solid var(--line);background:rgba(255,255,255,.04);border-radius:999px;padding:5px 10px;font-size:12px;font-weight:600;color:var(--txt2);cursor:pointer;transition:border-color .2s,color .2s,transform .2s var(--ease)}
.chip:hover{border-color:var(--green);color:#fff;transform:translateY(-1px)}
.chip.on{border-color:var(--green);color:#fff;background:rgba(86,239,159,.1)}
.sels{display:grid;grid-template-columns:1fr 34px 1fr;gap:6px;align-items:center}
.sels select,.plan-fila select{width:100%;background:rgba(0,18,64,.9);border:.5px solid var(--line);border-radius:9px;padding:8px 9px;font-size:13px;font-weight:600;appearance:none;-webkit-appearance:none;cursor:pointer}
#cambiar{width:34px;height:34px;border-radius:9px;border:.5px solid var(--line);background:rgba(255,255,255,.04);cursor:pointer;font-size:15px;color:var(--txt2)}
#cambiar:hover{color:#fff;border-color:var(--green)}
.res-cab{font-size:14px;font-weight:800;color:#fff}
.res-cab span{display:block;font-size:12px;font-weight:600;color:var(--txt3);margin-top:2px}
.gana{margin-top:8px;color:var(--green);font-weight:700;font-size:12.5px}
.tramo-fila{display:grid;grid-template-columns:1fr auto;gap:8px;padding:7px 0;border-bottom:.5px solid var(--line);font-size:12.5px;color:var(--txt2)}
.tramo-fila b{color:#fff;font-weight:700}
.tramo-fila em{font-style:normal;color:var(--txt3);text-align:right;white-space:nowrap}
.carr{display:inline-block;min-width:22px;text-align:center;border-radius:5px;padding:0 5px;font-size:11px;font-weight:800;color:var(--navy-deep);margin-left:4px}
.vacio{font-size:13px;color:var(--txt3);line-height:1.5}
.plan-fila{display:grid;grid-template-columns:92px 1fr;align-items:center;gap:8px;font-size:12px;color:var(--txt3);margin-bottom:7px}
.hitos{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.hitos div{border-radius:10px;padding:8px 9px;border:.5px solid var(--line);background:rgba(0,18,64,.55)}
.hitos b{display:block;font-size:17px;font-weight:800}
.hitos span{font-size:11px;color:var(--txt3)}
.reproductor{display:grid;grid-template-columns:36px 1fr;gap:10px;align-items:center}
#play-plan{width:36px;height:36px;border-radius:10px;border:.5px solid var(--line);background:rgba(86,239,159,.1);color:var(--green);cursor:pointer;font-size:14px}
#paso{width:100%;accent-color:var(--green)}
.plan-tit{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--green);font-weight:700}
.plan-nom{font-size:14px;font-weight:700;color:#fff;margin:2px 0 8px}
.mini4{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.mini4 div{background:rgba(0,18,64,.55);border:.5px solid var(--line);border-radius:9px;padding:6px 8px}
.mini4 b{display:block;font-size:15px;font-weight:800;color:#fff}
.mini4 span{font-size:11px;color:var(--txt3)}
.plan-pie{font-size:12px;color:var(--txt2);margin-top:7px}
.plan-pie b{color:#fff}
.curva svg{display:block;width:100%;height:110px}
.curva .ejes{display:flex;justify-content:space-between;font-size:10.5px;color:var(--txt3);margin-top:3px}

/* ── páginas: analítica y metodología ── */
.pag-banda{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin-bottom:12px}
.cifra{background:var(--card);border:.5px solid var(--line);border-radius:14px;padding:14px 16px}
.cifra b{display:block;font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.cifra b small{font-size:13px;color:var(--txt3);font-weight:600;margin-left:3px}

/* ── páginas de documento (Ejecución) ── */

.doc-hero{padding:4px 0 20px;border-bottom:.5px solid var(--line);margin-bottom:6px}

.cita{border-left:3px solid var(--green);padding:12px 18px;background:rgba(86,239,159,.06);border-radius:0 12px 12px 0;font-size:16.5px;line-height:1.45;font-weight:700;color:#fff;margin:16px 0;max-width:860px}

.dcard{background:var(--card);border:.5px solid var(--line);border-radius:14px;padding:14px 16px}

.dcard .que{font-size:13.5px;color:#fff;line-height:1.55}

.dcard.clic:hover{transform:translateY(-2px);border-color:var(--green)}
.tabla-envoltura{margin:12px 0 8px}
.tabla-doc{width:100%;border-collapse:collapse;font-size:13px}
.tabla-doc th{text-align:left;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--txt3);font-weight:700;padding:8px 10px;border-bottom:.5px solid var(--line);vertical-align:bottom}

.chip-c{display:inline-block;font-size:11px;font-weight:800;border-radius:999px;padding:2px 9px;white-space:nowrap}
.chip-c.compra{color:#56EF9F;background:rgba(86,239,159,.12);border:.5px solid rgba(86,239,159,.4)}
.chip-c.renta{color:#9fc0ff;background:rgba(42,137,251,.14);border:.5px solid rgba(42,137,251,.45)}

.formula{display:flex;flex-wrap:wrap;align-items:stretch;gap:8px;margin:14px 0}
.formula .f{flex:1 1 150px;background:var(--card);border:.5px solid var(--line);border-radius:14px;padding:12px 14px}
.formula .f b{display:block;font-size:22px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.formula .f span{display:block;font-size:12.5px;color:var(--txt3);margin-top:4px;line-height:1.35}
.formula .op{flex:none;display:grid;place-items:center;font-size:22px;font-weight:800;color:var(--green);padding:0 2px}
.formula .f.res{background:rgba(86,239,159,.08);border-color:rgba(86,239,159,.45)}
.formula .f.res b{color:var(--green)}
.nota{font-size:12.5px;color:var(--txt3);line-height:1.55;max-width:860px;margin-top:6px}
.nota b{color:var(--txt2)}
/* corte del pavimento en 3D */
.p3d{position:relative;max-width:980px;margin:16px 0 8px;border:.5px solid var(--line);border-radius:16px;background:radial-gradient(120% 90% at 35% 30%,#0a2c7c 0%,#021a55 55%,#001240 100%);overflow:hidden}
.p3d svg{display:block;width:100%;height:auto;max-height:min(600px,64vh);cursor:grab;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.p3d svg.girando{cursor:grabbing}
.p3d .c3,.p3d .mk,.p3d .lb{transition:opacity .25s}
.p3d svg.foco .c3:not(.on),.p3d svg.foco .mk:not(.on),.p3d svg.foco .lb:not(.on){opacity:.22}
.p3d .f{stroke:rgba(0,18,64,.5);stroke-width:.7;stroke-linejoin:round}
.p3d .c3.on .f{stroke:#56EF9F;stroke-width:1.3}
.p3d .lb{cursor:pointer}
.p3d .lb text{fill:#fff;font-weight:800;font-size:14px}

.p3d .lb.on text{fill:var(--green)}
.p3d-barra{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 14px;border-top:.5px solid var(--line);background:rgba(0,12,48,.55);flex-wrap:wrap}
.p3d-btn{border:.5px solid rgba(86,239,159,.5);background:rgba(86,239,159,.1);color:var(--green);border-radius:999px;padding:6px 14px;font-size:12.5px;font-weight:800;cursor:pointer}
.p3d-btn:hover{background:rgba(86,239,159,.18)}
.p3d-barra span{font-size:12px;color:var(--txt3)}
.p3d-lee{padding:12px 16px;border-top:.5px solid var(--line);font-size:13.5px;line-height:1.55;color:var(--txt2);min-height:52px}
.p3d-lee b{color:#fff}
.p3d-ley{display:flex;flex-wrap:wrap;gap:6px 16px;padding:0 16px 14px;font-size:12px;color:var(--txt3)}
.p3d-ley span{display:inline-flex;align-items:center;gap:6px}
.p3d-ley i{flex:none;display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:#FFC857;color:#001240;font-style:normal;font-size:10.5px;font-weight:800}
.p3d-ley i.n{background:#cfddff}
.planta-carril{max-width:860px;margin:10px 0;padding:14px;border:.5px solid var(--line);border-radius:14px;background:var(--card)}
.carril-vista{position:relative;height:74px;border-radius:8px;background:#3a4560;overflow:hidden}
.carril-vista .raya{position:absolute;top:0;bottom:0;left:85.7%;border-left:3px dashed #fff}
.carril-vista .extra{position:absolute;top:0;bottom:0;left:85.7%;right:0;background:rgba(86,239,159,.28)}
.carril-vista .llanta{position:absolute;width:10%;height:14px;border-radius:4px;background:#0b1433}
.carril-vista .etq{position:absolute;font-size:11px;font-weight:700;color:#fff;background:rgba(0,18,64,.75);border-radius:6px;padding:2px 6px}
.medidas{display:flex;justify-content:space-between;font-size:11.5px;color:var(--txt3);margin-top:6px}
/* calendario de 50 años */
.cal{max-width:900px;margin:14px 0}
.cal-fila{display:grid;grid-template-columns:170px minmax(0,1fr);gap:12px;align-items:center;margin-bottom:12px}
.cal-fila > b{font-size:13px;color:#fff;line-height:1.3}
.cal-fila > b span{display:block;font-size:11.5px;color:var(--txt3);font-weight:600}
.cal-linea{position:relative;height:30px;border-radius:8px;background:rgba(255,255,255,.04);border:.5px solid var(--line)}
.cal-linea .rombo{position:absolute;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;transform:rotate(45deg);background:#ff9b8a;border:1.5px solid var(--navy-deep)}
.cal-linea .barra{position:absolute;top:50%;width:3px;height:16px;margin:-8px 0 0 -1.5px;border-radius:2px;background:#9fc0ff}
.cal-linea .vida{position:absolute;top:9px;bottom:9px;left:0;border-radius:6px;background:linear-gradient(90deg,rgba(86,239,159,.5),rgba(86,239,159,.15))}
.cal-eje{display:grid;grid-template-columns:170px minmax(0,1fr);gap:12px}
.cal-eje div{position:relative;height:16px;font-size:11px;color:var(--txt3)}
.cal-eje div span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.cal-eje div span:last-child{transform:translateX(-100%)}
.cal-eje div span:first-child{transform:none}
.cal-ley{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--txt3);margin-top:4px}
.cal-ley i{display:inline-block;margin-right:6px;vertical-align:middle}
/* tren de colado */
.tren{display:flex;align-items:stretch;gap:0;margin:14px 0;max-width:980px;flex-wrap:wrap}
.tren .m{flex:1 1 150px;background:var(--card);border:.5px solid var(--line);border-radius:14px;padding:12px 14px;position:relative}
.tren .m b{display:block;font-size:13.5px;color:#fff}
.tren .m span{display:block;font-size:12px;color:var(--txt3);margin-top:4px;line-height:1.4}
.tren .m em{position:absolute;top:10px;right:12px;font-style:normal;font-size:11px;font-weight:800;color:var(--green)}
.tren .m.entrada{background:rgba(255,200,87,.07);border-color:rgba(255,200,87,.35)}
.tren .fl{flex:none;display:grid;place-items:center;width:26px;color:var(--green);font-weight:800}
/* frentes escalonados y día de 24 horas */
.gantt{max-width:980px;margin:14px 0}
.g-fila{display:grid;grid-template-columns:190px minmax(0,1fr);gap:12px;align-items:center;margin-bottom:8px}
.g-fila > b{font-size:12.5px;color:#fff;line-height:1.25}
.g-fila > b span{display:block;font-size:11px;color:var(--txt3);font-weight:600}
.g-pista{position:relative;height:26px;border-radius:7px;background:rgba(255,255,255,.035);border:.5px solid var(--line)}
.g-seg{position:absolute;top:3px;bottom:3px;border-radius:5px;font-size:11px;font-weight:700;color:#0b1433;display:flex;align-items:center;justify-content:center;white-space:nowrap;overflow:hidden;padding:0 6px}
.g-eje{display:grid;grid-template-columns:190px minmax(0,1fr);gap:12px}
.g-eje div{position:relative;height:18px;font-size:11px;color:var(--txt3)}
.g-eje div span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.g-eje div span:last-child{transform:translateX(-100%)}
.g-eje div span:first-child{transform:none}
.g-marca{position:absolute;top:-4px;bottom:-4px;border-left:2px dashed rgba(255,200,87,.8)}
/* organigrama */
.org{max-width:1000px;margin:16px 0}
.org-dir{margin:0 auto;max-width:320px;text-align:center;background:rgba(0,57,200,.3);border:.5px solid rgba(42,137,251,.6);border-radius:14px;padding:12px 16px}

.org-nota{max-width:560px;margin:10px auto 0;text-align:center;font-size:12px;color:var(--txt3)}
/* plantilla: barra de personas */
.pila-gente{display:flex;height:40px;border-radius:10px;overflow:hidden;margin:14px 0 8px;max-width:980px}
.pila-gente div{display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#0b1433;border-right:1px solid rgba(0,18,64,.35);overflow:hidden;white-space:nowrap}
.pila-ley{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--txt3);max-width:980px}

/* lista de verificación y escalera de recortes */
.check{list-style:none;padding:0!important;display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:8px;max-width:none!important}

.escalera{max-width:900px;margin:12px 0}
.escalon{display:grid;grid-template-columns:44px 150px minmax(0,1fr);gap:12px;align-items:start;padding:10px 12px;border-radius:12px;border:.5px solid var(--line);background:var(--card);margin-bottom:6px}
.escalon .n{font-size:20px;font-weight:800;color:#fff}
.escalon .q{font-size:13.5px;font-weight:700;color:#fff;line-height:1.35}
.escalon .p{font-size:12.8px;color:var(--txt3);line-height:1.5}
.recorta{font-size:12px;font-weight:700;color:#ff9b8a;margin:6px 0 0}
.barras-eq .fila-eq{display:grid;grid-template-columns:150px minmax(0,1fr) 60px;gap:10px;align-items:center;margin-top:6px;font-size:12.5px;color:var(--txt2)}
.barras-eq i{display:block;height:12px;border-radius:5px}
.barras-eq b{text-align:right;color:#fff}
.comparar{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:900px;margin:12px 0}
.comparar > div{border-radius:14px;padding:14px 16px;border:.5px solid var(--line)}
.comparar .antes{background:rgba(255,120,100,.06);border-color:rgba(255,120,100,.3)}
.comparar .despues{background:rgba(86,239,159,.06);border-color:rgba(86,239,159,.35)}
.comparar h4{font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:800;margin-bottom:8px}

}

/* ── celular: barra superior con ☰ y la barra lateral como cajón ── */
@media (max-width:900px){

    : `<b>${V}.0 contra hoy:</b> los viajes entre capitales duran <b>${pct(1 - m.prom / b.prom)} menos</b>, a 4 horas de cada ciudad hay <b>${(m.merc4 / b.merc4).toFixed(1)} veces</b> más gente, se ahorran <b>$${fmt(m.ahorro)} mil millones al año</b> por una inversión de $${fmt(m.inv)} mil millones y mueren <b>${fmt(b.muertes - m.muertes)} personas menos</b> cada año.`;

      ${preg('¿A cuánta gente llegamos?', m.merc4.toFixed(1), 'M', 'personas de otras ciudades a 4 horas o menos, en promedio',
        hoy ? '' : `${(m.merc4 / b.merc4).toFixed(1)} veces el mercado de hoy`,
        barras(x => x.merc4, v => v.toFixed(1) + ' M personas'),
        `<b>${pct(m.puerto4)}</b> de la población vive a 4 horas de un puerto y <b>${pct(m.front8)}</b> a 8 horas de la frontera norte${hoy ? '' : ` (hoy ${pct(b.puerto4)} y ${pct(b.front8)})`}.`)}
      ${preg('¿Cuánto más viajamos?', '×' + m.viajes.toFixed(2), '', 'viajes entre ciudades (hoy = 1)',
        `${fmt(m.personas)} personas viajan al día${hoy ? '' : ` (hoy ${fmt(b.personas)})`}`,

        'Cuando el viaje se acorta, la gente viaja más: el modelo lo mide con el tiempo de viaje, no con los kilómetros.')}
      ${hoy
        ? preg('¿Cuánto cuesta moverse?', '$' + fmt(b.costo), 'mil M al año', 'en tiempo y vehículo entre ciudades, con el tránsito de 2035', '',
            barras(x => x.recupera, (v, mm) => mm.inv ? `${Math.round(v)} años · $${fmt(mm.inv)}` : '—'),
            'Las barras dicen en cuántos años se recupera cada versión con lo que ahorra, y cuánto cuesta.')
        : preg('¿Cuánto cuesta y cuánto devuelve?', '$' + fmt(m.ahorro), 'mil M al año', 'de ahorro en tiempo y vehículo (tránsito de 2035)',
            `por $${fmt(m.inv)} mil millones de inversión: se recupera en ${Math.round(m.recupera)} años`,
            barras(x => x.recupera, (v, mm) => mm.inv ? `${Math.round(v)} años · $${fmt(mm.inv)}` : '—'),
            `Beneficio ÷ costo a 30 años: <b>${m.bc.toFixed(2)}</b>. Mayor que 1 quiere decir que se paga sola con tiempo y combustible; no cuenta vidas, exportaciones ni aglomeración, así que el beneficio real es mayor.`)}
      ${preg('¿Es más segura y más limpia?', fmt(m.muertes), '', 'muertes al año en la red',
        hoy ? '' : `${fmt(b.muertes - m.muertes)} vidas al año que se salvan`,

      ${preg('¿Qué tan ancha es la red?', pct(m.km4 / m.km), '', 'de la red con 4 carriles o más',

        `<span class="ley-col">${[2, 4, 6, 10].map(L => `<span><i style="background:${colL(L)}"></i>${L === 2 ? '2' : L === 4 ? '4' : L === 6 ? '6–8' : '10+'} carriles</span>`).join('')}</span>`)}

      <div class="ana-grid">
        <div class="ana-card ancho"><h5>Todas las métricas</h5>${tablaHTML(FILAS)}</div>
        <div class="ana-card"><h5>Conexiones más lentas entre capitales · ${V}.0</h5>${m.peores.slice(0, 8).map(([a, bb, min]) => `<div class="fila-ana"><span>${C[a].n}–${C[bb].n}</span><em>${hm(min)} · ${Math.round(distRecta(a, bb) / (min / 60))} km/h</em></div>`).join('')}</div>
        <div class="ana-card"><h5>Tramos saturados en 2035 · ${V}.0</h5>${m.sat.length ? m.sat.slice(0, 10).map(([i, vc]) => `<div class="fila-ana"><span>${nombreT(T[i])}</span><em>${Math.round(vc * 100)} %</em></div>`).join('') : '<div class="fila-ana"><span>Ninguno: la capacidad alcanza para 2035.</span></div>'}</div>
        <div class="ana-card"><h5>Acceso a puertos, frontera y CDMX · ${V}.0</h5>
          ${[['A ≤ 4 h de un puerto', 'puerto4'], ['A ≤ 8 h de la frontera norte', 'front8'], ['A ≤ 5 h de la CDMX', 'cdmx5']].map(([n, k]) => `<div class="sub" style="margin-top:6px">${n}</div>${VS.map(v => vbar(v, M[v][k] * 100, pct(M[v][k]) + ' de la población', v === V, true)).join('')}`).join('')}</div>
      </div>

    <p class="nota ana-nota">Tiempos y velocidades con el tránsito de hoy, para comparar las versiones en igualdad; economía, seguridad y ambiente con el tránsito de 2035. Costos paramétricos 2026. Detalle en <a href="#metodo" data-ir="metodo">Metodología</a>.</p>`;
  pagina.querySelector('.ana-mas').addEventListener('toggle', e => { anaAbierta = e.target.open; });
  engancharVbars(pagina);
}

/* ── sección: Metodología (página completa) ── */

  pagina.innerHTML = `<div class="metodo">
    ${card('1 · Trazo real', `<p>La red se modela con <b>${C.length} ciudades y ${T.length} tramos</b>. Cada tramo se traza con A* por la ruta más rápida sobre <a href="https://www.openstreetmap.org" target="_blank" rel="noopener">OpenStreetMap</a> (autopistas, troncales, rampas y federales, septiembre de 2026), siguiendo el número de carretera. Natural Earth sólo rellena huecos; en la Sierra Tarahumara se usan los caminos estatales.</p><p>Proyección cónica conforme de Lambert con los parámetros del INEGI.</p>`)}
    ${card('2 · Carriles de hoy', `<p>Se miden en OSM a lo largo de cada tramo, sin las entradas urbanas: el número que se cumple en al menos 60 % del recorrido. Donde OSM no marca carriles se asumen 2.</p><p>Contrastados con el inventario SICT de la red federal (dic. 2024) y el Anuario 2024: 52,044 km federales, 14,255 de ellos con 4 carriles o más.</p>`)}
    ${card('3 · Tránsito', `<p>Modelo gravitacional: población × población ÷ distancia<sup>1.6</sup>, más masa logística de puertos y fronteras (Nuevo Laredo, Manzanillo, Lázaro Cárdenas, Veracruz, Piedras Negras…). Se reparte en la red con asignación estocástica y se calibra a <b>~70 mil vehículos/día</b> en México–Querétaro.</p><p>Hacia 2050 las personas crecen ×1.7 y la carga ×2.6 por el nearshoring.</p>`)}
    ${card('4 · Grosor por versión', `<table class="param"><tr><td>2.0 · demanda 2035</td><td>12,000 veh/carril</td></tr><tr><td>3.0 · demanda 2050, nivel B</td><td>10,000 veh/carril</td></tr><tr><td>4.0 · demanda 2050, nivel A–B</td><td>8,500 veh/carril</td></tr><tr><td>Camión (carga)</td><td>2 autos</td></tr><tr><td>Mínimo 3.0 · rutas de exportación</td><td>6 carriles</td></tr><tr><td>Mínimo 4.0 · corredor central</td><td>10–14 carriles</td></tr></table>`)}
    ${card('5 · 3.0 y 4.0', `<p><b>3.0:</b> todo tramo cuyo recorrido es 20 % mayor que la línea recta se rectifica con túneles y viaductos (115 km/h en llano, 100 en sierra).</p><p><b>4.0:</b> toda la red a 130 km/h (118 en sierra). Donde el camino de hoy ya es recto — un trazo nuevo lo acortaría menos de 10 % — se amplía y se mejora en su lugar; donde rodea, se abre trazo nuevo. Un algoritmo prueba cada par de ciudades por tierra y construye la línea directa donde el beneficio supera el costo; después “cose” la red hasta que ninguna ciudad quede con rodeos grandes hacia sus vecinas.</p>`)}
    ${card('6 · Plan de obra', `<p>Cada tramo se construye <b>una sola vez, directo a su estándar final</b> — el de 4.0 —, y en cada paso va la obra con mayor <b>beneficio ÷ costo</b> dado lo que ya existe (efectos de red). Las obras se agrupan como se licitan: proyectos de un corredor, cada conexión directa nueva y, lo demás, por eje.</p><p>Construir por etapas — todo 2.0, luego todo 3.0, luego 4.0 — costaría <b>$${fmt(D.plan.etapas)} mil millones</b> para llegar a la misma red, $${fmt(D.plan.etapas - PL[PL.length - 1].cc)} más: se pagarían ampliaciones sobre caminos que 4.0 sustituye y trazos de 3.0 que se vuelven a trazar. Es la regla del pavimento de 50 años llevada a la red: no se decide cómo construir, sino cuántas veces.</p><p>El año de cada obra depende del ritmo de inversión: $110, $220 o $330 mil millones al año.</p>`)}
    ${card('7 · Economía', `<table class="param"><tr><td>Valor del tiempo · auto</td><td>180 MXN/h</td></tr><tr><td>Valor del tiempo · camión</td><td>650 MXN/h</td></tr><tr><td>Operación · auto / camión</td><td>4.5 / 14 MXN/km</td></tr><tr><td>Horizonte y tasa social</td><td>30 años · 10 %</td></tr><tr><td>Ampliar a 4 carriles</td><td>45–95 M/km</td></tr><tr><td>Par de carriles extra</td><td>35–70 M/km</td></tr><tr><td>Trazo nuevo (3.0)</td><td>120–240 M/km</td></tr><tr><td>Alta velocidad, trazo nuevo (4.0)</td><td>170–330 M/km</td></tr><tr><td>A 130 km/h en su lugar (4.0)</td><td>30–60 M/km</td></tr></table>`)}
    ${card('8 · Tiempos, seguridad y ambiente', `<p>Velocidad según carriles, trazo y sierra, con congestión (curva BPR) y la demanda de hoy en las cuatro versiones, para compararlas en igualdad.</p><p>Muertes por 100 millones de veh-km: 2.8 en 2 carriles, 1.5 en 4+ carriles, 1.1 en trazo nuevo y 0.9 en alta velocidad. Combustible 0.155 L/km con ajuste por velocidad; CO₂ 2.5 kg/L.</p>`)}
    ${card('9 · Ejecución', `<p>Todo lo nuevo se construye con el estándar de <b>pavimento para 50 años</b> (losa de concreto reforzado continuo de 27 cm, carril colado de 4.20 m). La obra se mide en km-carril: un frente de 1 km/día cuela 2 carriles por noche, es decir 500 km-carril al año con unas 115 personas y una flotilla de USD 7.8–13.3 millones. Detalle en <a href="#formula" data-ir="formula">La fórmula</a>.</p>`)}

    ${card('Fuentes y licencias', `<p>© colaboradores de <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> (ODbL): los trazos derivados se ofrecen bajo la misma licencia. Natural Earth (dominio público). SICT: inventario de carriles de la red federal (dic. 2024), Anuario Estadístico 2024 y Programa Nacional de Infraestructura Carretera 2025–2030. INEGI: zonas metropolitanas, Censo 2020.</p>`)}

/* ── resaltar tramos ── */
function bboxTramos(es) {
  const bb = {x0: 1e9, y0: 1e9, x1: -1e9, y1: -1e9};
  es.forEach(i => {
    const o = R[i], g = ESTADO[i][1];
    const p = (g === 'r' && o.r) || (g === 'n' && o.n) || o.g || o.r || o.n; const b = p.getBBox();
    bb.x0 = Math.min(bb.x0, b.x); bb.y0 = Math.min(bb.y0, b.y); bb.x1 = Math.max(bb.x1, b.x + b.width); bb.y1 = Math.max(bb.y1, b.y + b.height);
  });
  return bb;
}
function resaltarTramos(es) {
  rutaAct = null;
  proyAct = es;
  svg.classList.add('atenuar');
  T.forEach((t, i) => { const f = es.includes(i); ['g', 'n', 'r'].forEach(k => R[i][k] && R[i][k].classList.toggle('foco', f)); });
  gHalos.innerHTML = '';
  es.forEach(i => halo(i, 'proy'));
  encuadrar(bboxTramos(es));
}
function resaltarProyecto() {
  proyAct = null;
  svg.classList.remove('atenuar');
  document.querySelectorAll('.foco').forEach(x => x.classList.remove('foco'));
  if (!rutaAct && seccion !== 'plan') gHalos.innerHTML = '';
}
function halo(i, cls) {
  const [L, g] = ESTADO[i];
  const d = dActiva(i, g || (T[i].gr ? 'r' : 'g'));
  if (!d) return;
  el('path', {d, class: 'halo ' + (cls || ''), style: `stroke-width:${(ANCHO[L] || ANCHO[4]) + (cls ? 7 : 5)}px`}, gHalos);
}

/* ── interacción sobre el mapa ── */
const tip = $('#tip');
function ponerTip(html, ev) {
  tip.innerHTML = html; tip.classList.add('on');
  const rc = $('#mapa-wrap').getBoundingClientRect(), tw = tip.offsetWidth, th = tip.offsetHeight;
  let x = ev.clientX - rc.left + 14, y = ev.clientY - rc.top + 14;
  if (x + tw > rc.width - 8) x = ev.clientX - rc.left - tw - 14;
  if (y + th > rc.height - 8) y = ev.clientY - rc.top - th - 14;
  tip.style.left = Math.max(8, x) + 'px'; tip.style.top = Math.max(8, y) + 'px';
}
function ocultarTip() { tip.classList.remove('on'); }
function tipTramo(i) {
  const t = T[i], mx = Math.max(...t.L);
  const vAct = seccion === 'plan' ? 0 : V;
  const filas = VS.map(v => {
    const L = t.L[v - 1], g = geoV(t, v);
    const nombre = L === 0 ? 'no existe' : `${L} carriles${g === 'n' ? ' · trazo recto' : g === 'r' ? ' · 130 km/h' : ''}`;
    const col = v > 1 && L > 0 ? colorTramo(t, L, g) : colorBase(L);
    return `<div class="fila${v === vAct ? ' act' : ''}"><span>${v}.0</span><i style="width:${(L / mx * 100) || 0}%;background:${col}"></i><span>${nombre}</span></div>`;
  }).join('');
  const hoy = t.L[0] ? `Hoy: ${Math.round(t.p4 * 100)} % del tramo con ≥ 4 carriles · ~${fmt(t.q[0])} veh/día (modelo)` : `Conexión nueva${t.motivo ? ` (${t.motivo === 'valor' ? 'por beneficio/costo' : 'articulación de la red'})` : ''}.`;
  const tiempos = VS.filter(v => t.m[v - 1]).map(v => `${v}.0 ${hm(t.m[v - 1])}`).join(' · ');
  const vk = seccion === 'plan' ? 4 : V;
  return `<div class="t1">${nombreT(t)}</div><div>Carr. ${t.ref || 's/n'} · <b>${fmt(t.K[vk - 1] || t.K[3])} km</b>${t.mont ? ' · sierra' : ''}</div>${filas}<div style="margin-top:7px">${hoy}</div><div style="margin-top:3px">${tiempos}</div>`;
}
gHits.addEventListener('pointermove', ev => { if (arrastre && movido) return; const i = ev.target.dataset.i; if (i !== undefined) ponerTip(tipTramo(+i), ev); });
gHits.addEventListener('pointerleave', ocultarTip);
gHits.addEventListener('click', ev => { if (movido) return; const i = ev.target.dataset.i; if (i !== undefined) ponerTip(tipTramo(+i), ev); });
const PROM_C = {};   // tiempo medio de cada ciudad a las capitales, por versión (se calcula una vez)
function tipCiudad(i) {
  const c = C[i];
  const prom = PROM_C[i] || (PROM_C[i] = VS.map(v => { const r = dijkstra(v, i); let s = 0, n = 0; CAPS.forEach(k => { if (k !== i && isFinite(r.dist[k])) { s += r.dist[k]; n++; } }); return s / n; }));
  const vAct = seccion === 'plan' ? 0 : V;
  return `<div class="t1">${c.n}</div><div>${c.p >= 1000 ? (c.p / 1000).toFixed(1) + ' M' : fmt(c.p) + ' mil'} habitantes${c.c ? ' · capital' : ''}</div><div style="margin-top:6px">A las capitales, en promedio:</div>` +
    VS.map(v => `<div class="fila${v === vAct ? ' act' : ''}"><span>${v}.0</span><i style="width:${(prom[v - 1] / prom[0] * 100).toFixed(0)}%;background:${v === 1 ? '#6f8bd0' : v === 4 ? COL.nue : COL.amp}"></i><span>${hm(prom[v - 1])}</span></div>`).join('') +
    `<div style="margin-top:6px;color:var(--txt3)">${sel.length === 1 && sel[0] !== i ? 'Toca para medir el viaje' : 'Toca para salir desde aquí'}</div>`;
}
gC.addEventListener('pointermove', ev => { if (arrastre && movido) return; const g = ev.target.closest('.ciudad'); if (!g) return; g.classList.add('hover'); ponerTip(tipCiudad(+g.dataset.c), ev); });
gC.addEventListener('pointerout', ev => { const g = ev.target.closest('.ciudad'); if (g) g.classList.remove('hover'); ocultarTip(); });
gC.addEventListener('click', ev => {
  if (movido) return;
  const g = ev.target.closest('.ciudad'); if (!g) return;
  const i = +g.dataset.c;
  ev.stopPropagation();
  if (sel.length === 1 && sel[0] !== i) { selViaje(sel[0], i); return; }
  sel = [i]; rutaAct = null; gHalos.innerHTML = ''; marcarSel();
  if (seccion !== 'viaje') irSeccion('viaje', false); else panelViaje();
});
svg.addEventListener('click', ev => {
  if (movido) return;
  if (!ev.target.closest('.ciudad') && !ev.target.classList.contains('hit')) {
    if (proyAct) { resaltarProyecto(); panel.querySelectorAll('.item.on').forEach(x => x.classList.remove('on')); }
    ocultarTip();
  }
});

document.querySelectorAll('#versiones button[data-v]').forEach(b => b.onclick = () => { pararPlay(); pintar(+b.dataset.v); });

addEventListener('keydown', ev => {

  }
});
setTimeout(() => { const a = $('#ayuda-mapa'); if (a) a.style.opacity = 0; }, 9000);

medirEtiquetas();

if (document.fonts) document.fonts.ready.then(() => { medirEtiquetas(); aplicarVB(); });
const h = /#(\w+?)(?:-v([1-4]))?$/.exec(location.hash);
