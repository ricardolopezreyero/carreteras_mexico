    </div>`;
  pagina.innerHTML = `<div class="doc">
    ${heroDoc('Un manual por puesto, <em>leído antes del primer turno</em>.',
      `Son ${PERFILES_DOC.length} puestos y ${plazas} plazas por frente, más la estructura de proyecto. Cada uno tiene su documento en Word: a quién buscamos y cómo lo entrevistamos, lo que tiene que saber y cómo lo vamos a formar. Se usa para contratar y se entrega completo el día de la oferta.`)}

      <a class="pf-bajar grande" href="${PERFILES_ZIP.a}" download="${PERFILES_ZIP.d}">${svgBajar}Descargar todos</a>

    ${h2Doc('pf-como', 'Contratar, entregar, comprobar', 'Cómo se usan')}
    <div class="dcards">
      ${tarjeta('<i>1</i>Para contratar', 'La parte 1 es el perfil: experiencia, escolaridad, el tipo de persona, las señales de alerta, las preguntas de entrevista con la respuesta que buscamos y una prueba práctica en campo.', 'Quien entrevista lleva el documento impreso y marca lo que escuchó.')}
      ${tarjeta('<i>2</i>Para entregar', 'El día de la oferta se entrega completo. La persona lo lee antes de su primer turno: la parte 2 es lo que tiene que saber y la parte 3, cómo la vamos a formar.', 'Nadie empieza solo ni a velocidad plena.')}
      ${tarjeta('<i>3</i>Para comprobar', 'Al terminar el ingreso, el jefe directo hace las preguntas de comprobación. Se contestan sin leer. Luego se firma la constancia de lectura.', 'La constancia se archiva en el expediente de la persona.')}
    </div>
    <h3>Qué trae cada manual</h3>
    ${tablaDoc(['Parte', 'Qué trae'], [
      ['Portada y carta', 'Los datos del puesto (línea, a quién reporta, plazas, turno, sueldo y variable) y una carta de bienvenida con el porqué del proyecto.'],
      ['1 · El perfil', 'Para qué existe el puesto, de qué responde, qué puede decidir, experiencia, escolaridad, tipo de persona, señales de alerta, preguntas de entrevista, prueba práctica, sueldo, variable e indicadores.'],
      ['2 · Lo que tiene que saber', 'Un día normal, lo específico del puesto, los números que tiene que traer en la cabeza, los errores que cuestan 50 años y lo que todos saben en esta obra.'],
      ['3 · Su capacitación', 'Semana por semana, con quién aprende, sus certificaciones, las preguntas de comprobación y su siguiente escalón.'],
      ['4 · El acuerdo', 'Lo que le prometemos, lo que le pedimos y la constancia de lectura con firma.'],
    ])}
    <p class="nota">Los sueldos y las plazas salen de la misma base que el Cotizador y la <a href="#equipo" data-ir="equipo" style="color:var(--green)">Plantilla</a>: si cambian ahí, se regeneran los documentos.</p>

    ${h2Doc('pf-lista', 'Uno por puesto', 'Los perfiles')}

    <div id="pf-grupos">${grupos.map(g => {

        <div class="pf-cards">${ps.map(ficha).join('')}</div></section>`;
    }).join('')}</div>
    <p class="nota" id="pf-nada" hidden>Ningún puesto coincide con la búsqueda.</p>
  </div>`;
  let grupo = '';
  const filtrar = () => {
    const q = pagina.querySelector('#pf-buscar').value.trim().toLowerCase();
    let hay = 0;
    pagina.querySelectorAll('.pf-grupo').forEach(s => {
      let n = 0;
      s.querySelectorAll('.pf-card').forEach(c => { const ok = (!grupo || s.dataset.g === grupo) && (!q || c.dataset.q.includes(q)); c.hidden = !ok; n += ok; });
      s.hidden = !n; hay += n;
    });
    pagina.querySelector('#pf-nada').hidden = !!hay;
  };

  const svg = fig.querySelector('svg'), lee = fig.querySelector('.p3d-lee'), ley = fig.querySelector('.p3d-ley'), btn = fig.querySelector('.p3d-btn');
  const K = CAPAS_3D.length, EZ = 3.6, LG = 5, GAP = 0.72, S = 50;   // EZ: exageración vertical
  const AZ = [0.22, 0.95], EL = [0.3, 0.72], reducir = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let az = 0.5, el = 0.5, ex = 0, fijo = -1, foco = -1, lados = null, caja = null, anim = 0, raf = 0;
  const lim = (x, [a, b]) => Math.min(b, Math.max(a, x));
  const tono = (hex, f) => '#' + [1, 3, 5].map(i => Math.round(parseInt(hex.slice(i, i + 2), 16) * f).toString(16).padStart(2, '0')).join('');
  const zsDe = e => { let z = 0; return CAPAS_3D.map(c => { const z0 = z; z += c.e * EZ + GAP * e; return [z0, z0 + c.e * EZ]; }); };
  function proyector(a, b, e) {
    const zs = zsDe(e), cz = zs[K - 1][1] / 2, cx = 3.85, cy = LG / 2;
    const ca = Math.cos(a), sa = Math.sin(a), cb = Math.cos(b), sb = Math.sin(b);
    return {zs, p: (x, y, z) => { const X = (x - cx) * ca + (y - cy) * sa, d = -(x - cx) * sa + (y - cy) * ca; return [X * S, -((z - cz) * cb + d * sb) * S]; }};
  }
  // una caja fija que abarca todos los giros y los dos estados: el bloque no "respira" al girar
  function medir() {
    const r = {x0: 1e9, x1: -1e9, y0: 1e9, y1: -1e9};
    for (let i = 0; i <= 6; i++) for (let j = 0; j <= 4; j++) for (const e of [0, 1]) {
      const {zs, p} = proyector(AZ[0] + (AZ[1] - AZ[0]) * i / 6, EL[0] + (EL[1] - EL[0]) * j / 4, e);
      CAPAS_3D.forEach((c, k) => { for (const x of [0, c.w]) for (const y of [-0.6, LG]) for (const z of zs[k]) {
        const [X, Y] = p(x, y, z); r.x0 = Math.min(r.x0, X); r.x1 = Math.max(r.x1, X); r.y0 = Math.min(r.y0, Y); r.y1 = Math.max(r.y1, Y);
      } });
    }
    return {x0: r.x0 - 16, x1: r.x1 + 16, y0: r.y0 - 24, y1: r.y1 + 26};
  }
  const DEFS = `<defs><filter id="p3-sombra" x="-40%" y="-80%" width="180%" height="260%"><feGaussianBlur stdDeviation="10"/></filter>
    ${[['grava-f', '#d6c396'], ['grava-a', '#e7d9b2']].map(([id, c]) => `<pattern id="p3-${id}" width="9" height="9" patternUnits="userSpaceOnUse"><rect width="9" height="9" fill="${c}"/><circle cx="2.5" cy="2.5" r="1.3" fill="rgba(90,70,30,.34)"/><circle cx="7" cy="6.6" r="1" fill="rgba(90,70,30,.26)"/><circle cx="5.4" cy="1" r=".7" fill="rgba(255,255,255,.4)"/></pattern>`).join('')}
    ${[['suelo-f', '#8a6a47'], ['suelo-a', '#a2805a']].map(([id, c]) => `<pattern id="p3-${id}" width="11" height="8" patternUnits="userSpaceOnUse"><rect width="11" height="8" fill="${c}"/><path d="M1 2.5h3.5M6.5 6h3" stroke="rgba(40,25,10,.32)" stroke-width="1"/></pattern>`).join('')}</defs>`;
  function dibujar() {
    const {zs, p} = proyector(az, el, ex);
    const pt = q => p(...q).map(v => v.toFixed(1)).join(',');
    const pol = (pts, at) => `<polygon points="${pts.map(pt).join(' ')}" ${at}/>`;
    const lin = (a, b, at) => { const [x1, y1] = p(...a), [x2, y2] = p(...b); return `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" ${at}/>`; };
    const [sx, sy] = p(3.85, LG / 2, 0);
    let h = `<ellipse cx="${sx.toFixed(1)}" cy="${(sy + 10).toFixed(1)}" rx="${(4.9 * S).toFixed(0)}" ry="${(1.9 * S * Math.sin(el) + 12).toFixed(0)}" fill="rgba(0,5,22,.6)" filter="url(#p3-sombra)"/>`;
    CAPAS_3D.forEach((c, k) => {
      const [z0, z1] = zs[k];
      const piezas = k === K - 1 ? [[0, 4.2, 1], [4.2, c.w, 0.92]] : [[0, c.w, 1]];   // la losa: carril y hombro
      let g = '';
      piezas.forEach(([x0, x1, f], j) => {
        const col = c.col.map(x => f === 1 ? x : tono(x, f));
        if (j === piezas.length - 1) g += pol([[x1, 0, z0], [x1, LG, z0], [x1, LG, z1], [x1, 0, z1]], `class="f" fill="${col[2]}"`);
        g += pol([[x0, LG, z1], [x1, LG, z1], [x1, 0, z1], [x0, 0, z1]], `class="f" fill="${c.tex ? `url(#p3-${c.tex}-a)` : col[1]}"`);
        g += pol([[x0, 0, z0], [x1, 0, z0], [x1, 0, z1], [x0, 0, z1]], `class="f" fill="${c.tex ? `url(#p3-${c.tex}-f)` : col[0]}"`);
      });
      if (k === K - 1) {                                    // losa: huellas, raya, franja de 60 cm, junta, acero
        for (const xc of [0.9, 2.7]) g += pol([[xc - 0.17, 0, z1], [xc + 0.17, 0, z1], [xc + 0.17, LG, z1], [xc - 0.17, LG, z1]], 'fill="rgba(40,52,80,.07)"');
        g += pol([[3.67, 0, z1], [4.2, 0, z1], [4.2, LG, z1], [3.67, LG, z1]], 'fill="rgba(86,239,159,.45)"');
        g += pol([[3.53, 0, z1], [3.67, 0, z1], [3.67, LG, z1], [3.53, LG, z1]], 'fill="#fff"');
        for (const [ya, yb] of [[0.2, 1.4], [2.6, 3.8]]) g += pol([[0.03, ya, z1], [0.16, ya, z1], [0.16, yb, z1], [0.03, yb, z1]], 'fill="#fff"');
        g += lin([4.2, 0, z1], [4.2, LG, z1], 'stroke="rgba(0,18,64,.45)" stroke-width="1"');
        const za = z1 - c.e * EZ / 3;
        g += lin([0.04, 0, za - 0.06], [4.16, 0, za - 0.06], 'stroke="#56627f" stroke-width="1.5"');
        for (let x = 0.075; x < 4.2; x += 0.15) { const [cx, cy] = p(x, 0, za); g += `<circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="1.9" fill="#34405e"/>`; }
        g += lin([3.8, 0, (z0 + z1) / 2], [4.6, 0, (z0 + z1) / 2], 'stroke="#34405e" stroke-width="1.6"');
      }
      if (k === 1) {                                        // subbase: geotextil y el dren de borde asomando
        g += pol([[0.03, 0, z0 + 0.03], [c.w - 0.03, 0, z0 + 0.03], [c.w - 0.03, 0, z1 - 0.03], [0.03, 0, z1 - 0.03]], 'fill="none" stroke="rgba(255,255,255,.7)" stroke-width="1" stroke-dasharray="4 3"');
        const xc = c.w - 0.32, zc = (z0 + z1) / 2, R = 0.2;
        const aro = (y, f = 1) => Array.from({length: 22}, (_, i) => { const t = i / 22 * Math.PI * 2; return [xc + R * f * Math.cos(t), y, zc + R * f * Math.sin(t)]; });
        for (let y = 0; y >= -0.6; y -= 0.1) g += pol(aro(y), 'fill="#dfe5f1"');
        g += pol(aro(-0.6), 'fill="#eef2f9" stroke="#8793ad" stroke-width="1"') + pol(aro(-0.6, 0.62), 'fill="#1b2340"');
      }
      h += `<g class="c3${foco === k ? ' on' : ''}" data-k="${k}">${g}</g>`;
    });
    // detalles A–D, con su línea al punto exacto
    const zl = zs[K - 1][1], zb = zs[1];
    const mks = [['A', K - 1, p(1.05, 0, zl - CAPAS_3D[K - 1].e * EZ / 3), -20, 20], ['B', 1, p(CAPAS_3D[1].w - 0.32, -0.6, (zb[0] + zb[1]) / 2), 20, 14],
      ['C', K - 1, p(3.6, LG * 0.22, zl), -6, -22], ['D', K - 1, p(5.2, LG * 0.6, zl), 12, -20]];
    const u = lados ? 1 : 1.55;                           // en celular el dibujo se reduce: marcadores más grandes
    h += mks.map(([l, k, [x, y], dx, dy]) => { const mx = x + dx * u, my = y + dy * u; return `<g class="mk${foco === k ? ' on' : ''}" data-k="${k}"><line x1="${x.toFixed(1)}" y1="${y.toFixed(1)}" x2="${mx.toFixed(1)}" y2="${my.toFixed(1)}" stroke="#FFC857" stroke-width="${1.2 * u}"/><circle cx="${mx.toFixed(1)}" cy="${my.toFixed(1)}" r="${8.5 * u}" fill="#FFC857" stroke="#001240" stroke-width="1.5"/><text x="${mx.toFixed(1)}" y="${(my + 3.8 * u).toFixed(1)}" text-anchor="middle" font-size="${10.5 * u}" font-weight="800" fill="#001240">${l}</text></g>`; }).join('');
    // nombres de las capas: a la derecha en pantalla ancha, números en celular
    const anc = CAPAS_3D.map((c, k) => p(c.w, LG * 0.5, (zs[k][0] + zs[k][1]) / 2));
    if (lados) {
      const xs = caja.x1 + 22, ys = [];
      let prev = -1e9;
      for (let k = K - 1; k >= 0; k--) { ys[k] = Math.max(anc[k][1], prev + 34); prev = ys[k]; }
      const sobra = ys[0] - (caja.y1 - 14); if (sobra > 0) ys.forEach((y, k) => { ys[k] = y - sobra; });
      h += CAPAS_3D.map((c, k) => `<g class="lb${foco === k ? ' on' : ''}" data-k="${k}"><polyline points="${anc[k][0].toFixed(1)},${anc[k][1].toFixed(1)} ${(xs - 12).toFixed(1)},${ys[k].toFixed(1)} ${(xs - 4).toFixed(1)},${ys[k].toFixed(1)}" fill="none" stroke="rgba(207,221,255,.55)" stroke-width="1"/><circle cx="${anc[k][0].toFixed(1)}" cy="${anc[k][1].toFixed(1)}" r="2.8" fill="#cfddff"/><rect x="${xs - 4}" y="${(ys[k] - 13).toFixed(1)}" width="250" height="26" fill="transparent"/><text x="${xs}" y="${(ys[k] + 4.5).toFixed(1)}">${c.n} <tspan class="cota">${c.cota}</tspan></text></g>`).join('');
    } else {
      h += CAPAS_3D.map((c, k) => `<g class="lb${foco === k ? ' on' : ''}" data-k="${k}"><circle cx="${(anc[k][0] + 20).toFixed(1)}" cy="${anc[k][1].toFixed(1)}" r="14" fill="${foco === k ? '#56EF9F' : '#cfddff'}" stroke="#001240" stroke-width="1.5"/><text x="${(anc[k][0] + 20).toFixed(1)}" y="${(anc[k][1] + 5.5).toFixed(1)}" text-anchor="middle" style="font-size:16px;fill:#001240">${k + 1}</text></g>`).join('');
    }
    svg.innerHTML = DEFS + h;
  }
  const pedir = () => { if (!raf) raf = requestAnimationFrame(() => { raf = 0; dibujar(); }); };
  function modo() {
    const l = fig.clientWidth >= 640;
    if (l !== lados) {
      lados = l; caja = caja || medir();
      svg.setAttribute('viewBox', `${caja.x0.toFixed(0)} ${caja.y0.toFixed(0)} ${(caja.x1 - caja.x0 + (lados ? 290 : 40)).toFixed(0)} ${(caja.y1 - caja.y0).toFixed(0)}`);
      ley.innerHTML = (lados ? '' : CAPAS_3D.map((c, k) => `<span><i class="n">${k + 1}</i>${c.n} · ${c.cota}</span>`).reverse().join('')) +
        DETALLES_3D.map(([l, t]) => `<span><i>${l}</i>${t}</span>`).join('');
    }
    dibujar();
  }
  const capaDe = t => { const g = t && t.closest ? t.closest('[data-k]') : null; return g ? +g.dataset.k : -1; };
  function enfocar(k) {
    foco = k;
    svg.classList.toggle('foco', k >= 0);
    svg.querySelectorAll('[data-k]').forEach(g => g.classList.toggle('on', +g.dataset.k === k));
    const c = CAPAS_3D[k];
    lee.innerHTML = c ? `<b>${k + 1} · ${c.n}, ${c.cota}.</b> ${c.txt}` : 'Son las cinco capas en el orden en que se construyen, de abajo hacia arriba, con la altura exagerada para que se lean. <b>Toca una capa</b> para ver qué hace.';
  }
  function separar(obj, ms = 1000) {
    cancelAnimationFrame(anim);
    btn.textContent = obj ? 'Juntar capas' : 'Separar capas';
    if (reducir || document.hidden) { ex = obj; dibujar(); return; }
    const e0 = ex, t0 = performance.now();
    const paso = now => { const k = Math.min(1, (now - t0) / ms), s = k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2; ex = e0 + (obj - e0) * s; dibujar(); if (k < 1) anim = requestAnimationFrame(paso); };

    }

  });
  svg.addEventListener('pointerup', ev => {
    if (arr && !arr.mov) { const k = capaDe(ev.target); fijo = k === fijo && ev.pointerType !== 'mouse' ? -1 : k; enfocar(fijo); }

  });
  svg.addEventListener('pointercancel', () => { arr = null; svg.classList.remove('girando'); });
  svg.addEventListener('pointerleave', ev => { if (!arr && ev.pointerType === 'mouse' && foco !== fijo) enfocar(fijo); });

  modo(); enfocar(-1);
  if (reducir || !('IntersectionObserver' in window)) separar(1);
  else {
    const io = new IntersectionObserver(es => { if (es.some(e => e.isIntersecting)) { io.disconnect(); setTimeout(() => separar(1), 300); } }, {threshold: 0.3});
    io.observe(fig); vigias3D.push(io);
  }
  if ('ResizeObserver' in window) { const ro = new ResizeObserver(() => modo()); ro.observe(fig); vigias3D.push(ro); }
}

PAGINAS.pavimento = () => {
  const enlace = (url, t) => `<a href="${url}" target="_blank" rel="noopener">${t}</a>`;
  const TX = 'https://www.cementx.org/solid_state_insights/crcp-in-texas', FHWA = 'https://international.fhwa.dot.gov/pubs/pl07027/llcp_07_03.cfm';
  const cal = (pos, tipo) => pos.map(x => `<i class="${tipo}" style="left:${x * 2}%"></i>`).join('');
  pagina.innerHTML = `<div class="doc">
    ${heroDoc('No estamos decidiendo cómo pavimentar. Estamos decidiendo <em>cuántas veces</em>.',
      'Con la práctica común en México, una carretera asfáltica se reconstruye 3 o 4 veces en 50 años. Una de concreto bien hecha se construye una vez y se le hace mantenimiento menor. El dinero total es parecido; lo que cambia es que en un caso se gasta una vez y en el otro para siempre, en obras que además cierran el camino cada década. Esta es la especificación de la segunda opción, para tránsito de tráileres en clima cálido extremo, con el detalle suficiente para construirla y para exigirla.')}
    ${indiceDoc([['p-seriedad', 'Por qué en serio'], ['p-muere', 'Cómo se muere'], ['p-concreto', 'Por qué concreto'], ['p-capas', 'Capa por capa'], ['p-losa', 'La losa'], ['p-mezcla', 'La mezcla'], ['p-mejoras', '8 mejoras'], ['p-no', 'Lo que no'], ['p-obra', 'Reglas de obra'], ['p-recorte', 'Si no alcanza'], ['p-50', '50 años'], ['p-garantia', 'Garantía'], ['p-region', 'Por región'], ['p-fuentes', 'Fuentes']])}

    ${h2Doc('p-seriedad', 'Antes de empezar', 'Por qué no estamos jugando con esto')}
    <p>Ninguna decisión de esta especificación es una preferencia técnica ni un lujo: <b>cada una bloquea una forma específica en la que las carreteras se mueren.</b> Y los errores en un pavimento <b>no se ven cuando se cometen</b>.</p>
    <p>Un concreto mal curado en junio se ve igual que uno bien curado, durante ocho años. Un espesor de 24 cm donde el proyecto decía 27 se ve igual en la foto de la entrega. Un dren tapado con tierra durante la obra se ve igual que uno que funciona. Cuando el daño se hace visible ya no existe la reparación: existe la reconstrucción, y la paga otra administración, otro presupuesto y otros usuarios.</p>
    ${citaDoc('El costo de equivocarse no lo paga quien se equivoca. Por eso la calidad no puede depender de la buena voluntad de nadie: tiene que estar escrita, medida y penalizada.')}

    ${h2Doc('p-muere', 'Lo más importante del documento', 'Cómo se muere una carretera')}
    <p>Las carreteras no se desgastan como un zapato. <b>Se mueren de cinco enfermedades</b>, y casi siempre de la primera. Todo lo demás de esta especificación son las cinco vacunas.</p>
    ${tablaDoc(['Enfermedad', 'Qué pasa en realidad', 'Cómo se ve por fuera', 'La vacuna'], [
      ['1 · Agua atrapada', 'El agua entra por una grieta y se queda debajo de la losa. Cada tráiler la bombea a presión y lava la tierra de abajo: se forma un hueco, la losa queda colgando y se rompe.', 'Grietas en esquinas, escalones entre losas, agua que brota al pasar un camión.', '<b>Drenaje de borde real + base tratada + losa impermeable</b>'],
      ['2 · Soporte desigual', 'El suelo no es blando: es desigual. Firme, blando, firme. La losa trabaja como una tabla apoyada en tres puntos y se parte por el que no tiene apoyo.', 'Grietas transversales que aparecen «sin razón», a intervalos irregulares.', '<b>Compactación uniforme medida punto por punto, no por promedio</b>'],
      ['3 · Contracción', 'El concreto se encoge al secarse. Si está amarrado a una base rígida no puede encogerse libre y se agrieta en los primeros días de vida. La grieta queda ahí 50 años.', 'Grietas finas tempranas que después se abren y se desportillan.', '<b>Menos cemento, curado interno, interfaz que deja deslizar</b>'],
      ['4 · Temperatura', 'El sol calienta la cara de arriba y la de abajo queda fría: la losa se pandea como una papa frita, se despega de su base y se rompe por el centro. Pasa todos los días: 18 mil veces en 50 años.', 'Grietas longitudinales al centro del carril, losas que «suenan» huecas.', '<b>Agregado calizo de baja expansión térmica</b>'],
      ['5 · Corrosión', 'El acero se oxida, el óxido ocupa más espacio y revienta el concreto desde dentro. Si era el acero que mantenía cerradas las grietas, las grietas se abren.', 'Manchas cafés, desportillamiento en juntas, grietas que crecen solas.', '<b>Acero galvanizado o inoxidable; pasajuntas de fibra de vidrio</b>'],
    ])}
    ${citaDoc('Ninguna de las cinco es «la carretera aguantó demasiado peso».')}
    <p>La intuición dice que una carretera se rompe porque pasan camiones muy pesados y que la solución es hacerla más gruesa. Es falso: <b>el espesor resuelve la carga, y la carga es el problema fácil</b>, el que sabemos calcular desde hace 60 años. Lo que mata a las carreteras es agua, suelo desigual, contracción, sol y óxido: cinco cosas que cuestan casi nada resolver bien y que no se resuelven con más concreto encima.</p>
    ${citaDoc('No estamos construyendo algo más grueso: estamos construyendo algo más seco, más parejo y más quieto.')}

    ${h2Doc('p-concreto', 'La decisión de material', 'Asfalto o concreto: por qué concreto')}
    <p>El asfalto no es un mal material: no es el correcto para esto, y la razón es una sola. <b>El asfalto se ablanda con el calor; el concreto no.</b> En un día de 45 °C la superficie negra pasa de 60 °C y el asfalto se vuelve una plastilina firme: un tráiler de 40 toneladas, despacio en una subida, deja su huella y el siguiente la hace más profunda. Eso es el ahuellamiento, y cuando llueve esas canaletas se llenan de agua: ahí empieza la enfermedad 1. El concreto está pegado con piedra hecha por reacción química; a 60 °C es igual de rígido que a 20 °C.</p>
    <h3>Los tres lugares donde se vuelve decisivo</h3>
    <div class="dcards">
      ${tarjeta('Subidas largas', 'El tráiler va a 30 km/h y planta su peso.')}
      ${tarjeta('Frenado y arranque', 'Casetas, cruces, semáforos y accesos.')}
      ${tarjeta('Patios de maniobra', 'El camión gira con el peso encima.')}
    </div>
    <p>Ahí un asfalto se ahuella en meses, no en años. <b>Ahí el concreto no es una preferencia: es la única opción honesta.</b></p>
    <h3>No es teoría: carreteras que ya lo probaron</h3>
    ${tablaDoc(['Evidencia', 'Qué dice'], [
      [enlace(TX, 'I-610, Houston'), 'Pavimento de concreto reforzado continuo <b>acercándose a 65 años de servicio</b>.'],
      [enlace(TX, 'Texas, promedio estatal'), 'Sus pavimentos de este tipo duran en promedio <b>39.5 años antes de la primera rehabilitación</b>, diseñados para 30.'],
      [enlace(FHWA, 'Quebec, Canadá'), 'De todo lo construido con estos criterios desde 1994, <b>menos del 1 % de las losas se ha agrietado</b>.'],
      [enlace(TX, 'Texas, costo comparado'), 'En un tramo real el concreto costó <b>menos</b> que el asfalto por unidad de superficie y necesitó mucho menos mantenimiento.'],
      [enlace(FHWA, 'Alemania, Austria, Bélgica, Países Bajos'), 'Diseñan sus autopistas de concreto a 30 años como <b>mínimo</b> de norma, y algunos a 40.'],
    ])}
    ${citaDoc('«El concreto es más caro.» Es más caro el día que se firma el cheque. Es más barato cualquier año después del doce.', true)}

    ${h2Doc('p-capas', 'La receta', 'Capa por capa, de abajo hacia arriba')}
    <p>Una carretera no es una plancha de concreto: son <b>cinco capas trabajando juntas</b>, y la de concreto es apenas la de arriba. Van en el orden en que se construyen, que también es el orden en que importan.</p>

    <div class="dcards dos">
      ${tarjeta('Capa 1 · El suelo: lo que se hace primero y casi nadie revisa', 'Compactar los 30 cm superiores al 95 % Proctor modificado, verificando <b>punto por punto</b>, no por promedio. <br><br><b>Arcilla expansiva</b> (índice plástico mayor a 20): estabilizar 30 cm con cal al 3–5 % o sustituir el material. <b>Suelos con sulfatos:</b> medirlos antes de estabilizar; si pasan de ~0.1 %, la cal o el cemento forman un mineral expansivo que levanta el pavimento años después.', 'La losa no necesita un suelo fuerte: necesita uno <b>parejo</b> (enfermedad 2). Un suelo uniformemente mediano es mejor que uno excelente con una bolsa blanda cada 40 m, porque ahí se va a partir la losa. El error de los sulfatos es caro y frecuente en zonas yesíferas del norte, y se evita con un ensayo de costo trivial.')}

    ${h2Doc('p-losa', 'La decisión más importante del diseño', 'La losa: concreto reforzado continuo, sin juntas')}
    <p>Una carretera de concreto normal lleva una junta cada 4.5 m: <b>más de 220 juntas por kilómetro</b>. Y las juntas son exactamente donde todo falla: por ahí entra el agua, ahí se escalonan las losas, ahí se desportilla el concreto y ahí hay que resellar cada 8 años, para siempre.</p>
    <p>El <b>CRCP</b> acepta el agrietamiento en lugar de pelear contra él: acero corrugado a lo largo de toda la carretera, colado sin juntas, y el concreto se agrieta solo cada 1 o 2 m. <b>El acero mantiene esas grietas cerradas y finas — menos de medio milímetro — toda la vida del pavimento</b>: una grieta así no deja pasar agua, no se escalona y no se desportilla. Cero juntas, cero resellado.</p>

    <h3>La geometría que regala vida sin costar nada</h3>

      ${tarjeta('Caliza, no grava de río', '<b>Caliza triturada</b> no reactiva, tamaño máximo 25–37.5 mm, 100 % triturada con al menos dos caras fracturadas, desgaste Los Ángeles ≤ 30 %, absorción ≤ 2.5 %, partículas planas o alargadas ≤ 10 %.', 'Con el sol, la losa se calienta arriba y abajo sigue fresca: se pandea (enfermedad 4). Cuánto depende casi por completo de la piedra: caliza y granito se expanden unas 4 unidades; cuarzo y pedernal, 7. Una losa de grava silicosa se mueve casi al doble. Y el norte de México tiene caliza de sobra: el insumo que más vida da es el más barato y cercano.')}

    <p class="nota">Los dos últimos renglones son los más importantes y los que casi nunca se piden en México: <b>especifican la durabilidad directamente</b> en lugar de suponerla a partir de la resistencia. Un concreto puede ser muy resistente y muy permeable a la vez: el resistente pasa la prueba y el permeable se muere en el año 22.</p>

    ${h2Doc('p-mejoras', 'De 50 a 75 años', 'Las ocho mejoras que existen hoy y casi no se usan')}
    <p>Todo lo anterior es un pavimento de 50 años. Estas ocho cosas lo llevan más lejos: tres cambian de categoría el resultado, dos hacen la obra más fácil de ejecutar y tres cuestan casi nada.</p>
    ${citaDoc('La número uno, para un clima como el nuestro: curado interno. El concreto carga su propia cantimplora, repartida en millones de puntos.')}
    <p>El problema de Torreón no es el calor: <b>es que el agua de curado se va antes de que el cemento la use</b>. Aun con membrana a doble dosis, el concreto se seca por dentro, se microagrieta desde el primer día, y esas grietas invisibles son la autopista por donde entra, 25 años después, lo que lo mata. La solución: sustituir <b>20–25 % de la arena por agregado ligero presaturado</b> — pómez o tezontle empapados de 24 a 72 horas antes —, que entrega el agua desde dentro mientras el cemento fragua. Cura de adentro hacia afuera.</p>
    <p>No es experimental: la FHWA de Estados Unidos lo tiene como innovación prioritaria y afirma que permite concretos que <b>pueden durar más de 75 años</b>; ya es práctica establecida en Texas, Nueva York, Indiana, Utah, Kansas, Ohio, Luisiana y Carolina del Norte. Y el agregado ligero que otros países fabrican en horno, <b>México lo tiene natural y barato</b>. La única exigencia es de control: medir la humedad del agregado en cada bachada; si entra seco, en lugar de dar agua la roba.</p>

    <p>La regla general: <b>para un activo que debe durar 50 años se exige evidencia de campo de al menos 30.</b> No basta con que funcione en el laboratorio; un material nuevo puede ser excelente y aun así no tener derecho a estar en esta obra.</p>

    <h3>La trampa que hay que evitar</h3>
    <p>El recorte que siempre se propone primero es <b>bajar el espesor</b>, porque es el más fácil de calcular y el más visible. Y es el equivocado: el espesor resuelve la carga, que es el problema fácil. Bajar de 27 a 24 cm cuesta algo de vida por fatiga; eliminar el dren de borde para pagar esos tres centímetros cuesta <b>el pavimento completo</b>.</p>

    <p class="nota">Esquema con los rangos del documento. <b>Asfalto:</b> reparaciones cada 10–15 años y reconstrucción en ese mismo horizonte. <b>Concreto con juntas:</b> rehabilitación entre los 25 y 35 años, más resellado de sus 220 juntas por km cada 8–10 años. <b>CRCP:</b> Texas promedia 39.5 años antes de la primera rehabilitación con diseños para 30; el I-610 de Houston se acerca a 65, y con curado interno la FHWA habla de más de 75. Su mantenimiento en 50 años: unos pocos parches y uno o dos esmerilados de diamante.</p>

      ${tarjeta('<i>2</i>Ejecución', 'Construir kilómetros con la flotilla.', 'Margen bajo, capital alto. Es el precio de entrada, no el premio.')}
      ${tarjeta('<i>3</i>Disponibilidad', 'La anualidad de conservación.', 'Margen alto y recurrente, y cada año vale más porque el pavimento se porta mejor de lo que el contrato asumió.')}
    </div>
    <p>La mayoría de las constructoras sólo juegan el segundo. <b>El dinero de largo plazo está en el tercero, y sólo lo puede cobrar quien construyó bien el primero.</b></p>

    ${h2Doc('n-ingresos', 'Los mismos activos, cinco ingresos', 'Las cinco fuentes de ingreso')}
    ${tablaDoc(['Fuente', 'Qué se vende', 'Margen típico', 'Recurrencia', 'Quién más puede hacerlo'], [
      ['1 · Ejecución de obra', 'Kilómetros construidos', '8–15 %', 'Por contrato', 'Cualquier constructora grande'],
      ['2 · Materiales y planta', 'Concreto y RCC, a la obra y a terceros de la región', '20–30 %', 'Continua mientras la planta esté montada', 'Concreteras locales'],
      ['3 · Conservación por disponibilidad', 'Kilómetro que cumple el estándar, cada año', '25–40 %', '15 a 30 años', 'Sólo quien lo construyó bien'],
      ['4 · Prefabricados', 'Paneles, canastillas, piezas de reparación', '20–35 %', 'Continua, a toda la región', 'Requiere planta e ingeniería propias'],
      ['5 · Ingeniería, datos y estándar', 'Diseño, supervisión, tablero de activos', '40–60 %', 'Recurrente y de bajo capital', 'Casi nadie'],
    ], ['', '', 'num', '', ''])}
    <p class="nota">Márgenes de referencia de la industria, para ordenar la discusión; los números de cada caso se construyen con cotizaciones reales.</p>
    <h3>Cómo se refuerzan entre sí</h3>
    <ul>
      <li><b>La planta paga sus tiempos muertos vendiendo a terceros:</b> un costo fijo se vuelve centro de utilidad.</li>
      <li><b>La ejecución compra el derecho a la conservación:</b> nadie firma una anualidad de 30 años sobre un pavimento que construyó otro.</li>
      <li><b>Los prefabricados salen del mismo diseño de mezcla y de la misma gente:</b> la curva de aprendizaje ya está pagada.</li>
      <li><b>Los datos hacen barata la conservación:</b> si se sabe cuáles 300 metros necesitan atención, se interviene con una cuadrilla y no con un programa.</li>
      <li><b>Y el estándar hace que te vuelvan a llamar:</b> quien escribe la especificación de referencia de una región compite en una cancha que él mismo dibujó.</li>
    </ul>
    <h3>La fuente 5 merece atención aparte</h3>
    <p>Es la más pequeña en pesos y la más valiosa estratégicamente: no requiere capital y no se copia rápido.</p>
    <div class="dcards">
      ${tarjeta('El estándar técnico', 'La especificación de 50 años vuelta referencia para dependencias y municipios de la región.')}
      ${tarjeta('Supervisión y laboratorio', 'Vendidos como servicio a obras que no son tuyas: pagan solos a un equipo que de otro modo sería puro costo.')}
      ${tarjeta('El tablero del activo', 'La telemetría del pavimento como servicio: el dueño ve en vivo cada kilómetro.', 'Ingreso recurrente, costo marginal casi cero y una relación que dura todo el ciclo de vida. Es la pieza que convierte una constructora en una empresa con ingreso recurrente, y la que menos cuesta empezar.')}
    </div>

    ${h2Doc('n-inversion', 'La frontera que decide la rentabilidad', 'La inversión')}
    ${citaDoc('Se compra lo que define la calidad y se usa todo el año. Se renta lo intensivo pero esporádico. Se subcontrata lo que es capacidad pura, sin criterio técnico.')}
    <p>Comprar de más convierte el negocio en un arrendador de fierro con mala utilización. Comprar de menos entrega la calidad — y con ella la conservación de 30 años — a un tercero que no responde por ella.</p>
    <h3>El capital de una flotilla de 1 km/día</h3>
    ${tablaDoc(['Bloque', 'Qué incluye', 'Millones de USD'], [
      ['Planta y almacenamiento', 'Planta móvil 250–280 m³/h, silos de cemento y ceniza', '1.5 – 3.0'],
      ['El tren de colado', 'Pavimentadora de gran formato con insertadora, colocadora-esparcidora, máquina de textura y curado', '2.5 – 4.0'],
      ['Enfriamiento', 'Planta de hielo o enfriador de agua', '0.3 – 0.6'],
      ['Transporte propio', '12 revolvedoras de 8 m³ (el resto subcontratado)', '1.6 – 2.4'],
      ['Terracería y base', 'Motoconformadoras 3D, rodillos, extendedora de alta densidad, excavación', '1.5 – 2.5'],
      ['Control y calidad', 'GNSS y control 3D, laboratorio móvil, perfilómetro, sensores, iluminación y generadores', '0.4 – 0.8'],
      Object.assign(['<b>Total flotilla</b>', '', '<b>7.8 – 13.3</b>'], {act: true}),

    <p class="nota">Órdenes de magnitud para dimensionar la conversación, no una cotización: cambian mucho entre equipo nuevo y seminuevo, entre marcas y con el tipo de cambio. El siguiente paso es pedir tres cotizaciones de la planta y el tren, que juntos son más de la mitad del total.</p>
    <h3>Cómo financiarlo sin comprometer la empresa</h3>
    <div class="dcards">
      ${tarjeta('<i>1</i>El plazo nunca excede el contratado', 'Si hay tres años de obra firmada, no se toma deuda a siete apostando a que habrá más.', 'Esa apuesta es la que quiebra constructoras en cada cambio de administración.')}
      ${tarjeta('<i>2</i>Arrendamiento para el fierro, capital propio para el conocimiento', 'El equipo se arrienda y se deduce contra el flujo del contrato.', 'El dinero propio se reserva para lo que no se arrienda: el equipo técnico, el tramo de prueba, el laboratorio y el tablero.')}
      ${tarjeta('<i>3</i>Nada se compra antes del contrato que lo usa', 'Con una excepción deliberada: el laboratorio y el tramo de prueba.', 'Se pagan antes porque son lo que permite ganar el contrato.')}
    </div>
    <h3>Si no hay para la flotilla completa: arrancar en tres pasos</h3>
    <ol>
      <li><b>Por la fuente 5</b> — ingeniería, especificación, supervisión y laboratorio: capital mínimo, margen alto, y construye la reputación técnica que justifica todo lo demás.</li>
      <li><b>Asociarse para el primer corredor</b> con una constructora que ya tenga flotilla, aportando el estándar, la supervisión y el control: se aprende la operación con capital ajeno.</li>
      <li><b>Comprar flotilla propia</b> cuando haya volumen contratado que la sostenga.</li>
    </ol>
    <p>Es más lento y mucho más difícil de perder.</p>

    ${h2Doc('n-capital', 'Con qué se paga todo esto', 'El dinero: capital de trabajo, flotilla y tipo de cambio')}
    ${tablaDoc(['Necesidad', 'Cómo se cubre', 'Por qué así'], [
      ['<b>Capital de trabajo</b> (materiales antes del cobro)', 'Anticipo de 20–30 %, estimaciones quincenales, crédito de cementera y acería a 60 días, factoraje de estimaciones aprobadas y una línea revolvente de 120 días de operación', 'Es el límite real del negocio y el riesgo que más constructoras mata en México: el pago tardío'],
      ['<b>Flotilla</b>', 'Arrendamiento con plazo igual al contrato, nunca mayor; compra sólo de las cuatro máquinas críticas cuando hay tres años de volumen', 'Nunca se toma deuda a siete años apostando a que habrá más obra'],
      ['<b>Tipo de cambio</b>', 'La flotilla se cotiza en dólares: arrendarla en pesos o cubrir el tipo de cambio al firmar', 'Una devaluación no puede convertir una obra rentable en pérdida'],
      ['<b>Insumos</b>', 'Contratos anuales indexados y escalación en el contrato de obra', 'El riesgo de precio se comparte, no se apuesta'],
      ['<b>Conservación</b>', 'La anualidad se vuelve colateral: con 30 años de flujo firmado se financia la siguiente flotilla', 'El negocio recurrente paga el crecimiento'],
    ])}


    ${h2Doc('n-equilibrio', 'No quiebran por construir mal: quiebran por tener flotilla sin volumen', 'El punto de equilibrio')}
    <p>Una flotilla propia tiene un costo fijo anual que corre trabaje o no — arrendamiento, nómina base, seguros, mantenimiento preventivo, campamento — y se reparte entre los kilómetros que se hagan al año. Con 250 km/año como referencia (un frente a ritmo pleno):</p>
    <div class="barras-eq" style="max-width:720px">${EQUILIBRIO.map(([km, x]) => `<div class="fila-eq"><span>${km} km al año</span><i style="width:${(x / 6.3 * 100).toFixed(0)}%;background:${colEq(km)}"></i><b>${x.toFixed(1)} ×</b></div>`).join('')}</div>
    <p class="nota">Costo fijo por kilómetro, contra la referencia de 250 km/año.</p>
    <div class="dcards">
      ${tarjeta('<span class="chip-c compra">Más de 150 km/año</span>', '<b>Flotilla propia</b>, con 3 años de visibilidad.', 'El costo fijo se diluye y el control de calidad — que sostiene la conservación de 30 años — se vuelve tuyo.')}
      ${tarjeta('<span class="chip-c neg">Entre 60 y 150 km/año</span>', '<b>Modelo mixto:</b> se compran la planta, el tren de colado y el laboratorio; se renta la terracería y se subcontrata el transporte.', 'Es el 60 % de la inversión con el 90 % del control sobre la calidad.')}
      ${tarjeta('<span class="chip-c pres">Menos de 60 km/año</span>', '<b>No se compra nada.</b> Se opera con la fuente 5 y se ejecuta en asociación con quien ya tiene flotilla.')}
    </div>
    ${citaDoc('La condición que vale más que el número es la visibilidad: 150 km contratados con plazo firme valen más que 300 km probables. Por eso el contrato plurianual de conservación también sirve para financiar la flotilla sin apostar la empresa.')}

    ${h2Doc('n-conservacion', 'La obra dura tres años; la conservación, treinta', 'El activo real: la conservación')}
    ${tablaDoc(['', 'Obra', 'Conservación por disponibilidad'], [
      ['Duración', '2 a 3 años', '15 a 30 años'],
      ['Margen', '8–15 %', '25–40 %'],
      ['Capital requerido', 'Muy alto', 'Bajo, ya está invertido'],
      ['Riesgo', 'De ejecución y de precio', 'De desempeño del pavimento'],
      ['Quién compite', 'Todas las constructoras', 'Prácticamente nadie'],
    ])}
    <h3>Por qué el riesgo es menor de lo que parece</h3>
    <p>La objeción obvia: ¿y si el pavimento falla y lo tengo que arreglar? El riesgo de desempeño lo controla quien escribió la especificación y la construyó. Las cifras de referencia dicen que un pavimento así promedia 39.5 años antes de su primera rehabilitación, que hay casos acercándose a 65 años y que con curado interno se habla de más de 75. <b>Se firma una anualidad de 30 años sobre un activo que, bien hecho, no necesita casi nada durante 25: el contrato asume un mantenimiento que el pavimento no va a consumir, y esa diferencia es la utilidad.</b> Quien construyó al 70 % de la especificación no puede firmar ese contrato, y si lo firma, lo pierde.</p>
    <h3>Qué tiene que decir el contrato</h3>
    <div class="dcards">
      ${tarjeta('Pago por disponibilidad', 'Con umbrales medibles: IRI, agrietamiento, drenaje funcionando, señalización.')}
      ${tarjeta('Descuentos automáticos', 'Calculados del dato, no de una inspección discrecional.')}
      ${tarjeta('Medición con la telemetría del pavimento', 'Auditable por el cliente en su propio tablero.')}
      ${tarjeta('Indexación de la anualidad', 'La anualidad se actualiza a lo largo de los 15 a 30 años del contrato.')}
      ${tarjeta('Ventana de revisión cada 5 años', 'Para eventos fuera de control razonable.', 'Es lo que hace firmable el contrato para ambos lados: nadie sensato asume 30 años de riesgo climático y de tránsito sin ella.')}
    </div>

    ${h2Doc('n-ventaja', 'La especificación se copia en cinco minutos', 'La ventaja defendible')}
    <p>El documento está escrito y cualquiera puede leerlo. La ventaja está en cuatro cosas que tardan años en construirse:</p>
    <div class="dcards">
      ${tarjeta('<i>1</i>El historial medido', 'Después de un corredor instrumentado se tienen datos reales de este diseño con estos agregados, este clima y estos camiones.', 'El segundo proyecto se cotiza con menos riesgo que cualquier competidor: más barato o con más margen.')}
      ${tarjeta('<i>2</i>La disposición a firmar la garantía', 'Cualquiera promete 50 años; muy pocos firman una anualidad condicionada a que se cumpla.', 'El competidor no puede imitarla sin asumir un riesgo que no sabe calcular.')}
      ${tarjeta('<i>3</i>El equipo entrenado', 'Los cuatro operadores críticos, el gerente de calidad que sabe decir que no, el despachador que sostiene los dos minutos.', 'En la región hay pocos, y ya serían tuyos.')}
      ${tarjeta('<i>4</i>El estándar adoptado', 'Si las dependencias licitan con esta especificación, la cancha queda dibujada a tu favor sin pelear cada licitación.', 'Es la jugada más barata y la más lenta: se gana publicándola, enseñándola y regalándola.')}
    </div>
    ${citaDoc('La que NO es ventaja: tener la flotilla. El fierro se compra con dinero y el dinero lo tiene cualquiera con acceso a crédito. La flotilla es la barrera de entrada, no la ventaja; confundirlas lleva a sobreinvertir en equipo y subinvertir en la gente y los datos, que es donde sí se defiende el negocio.', true)}

    ${h2Doc('n-riesgos', 'Y cómo se cubre cada uno', 'Riesgos')}
    ${tablaDoc(['Riesgo', 'Qué tan grave', 'Cómo se cubre'], [
      ['Volumen contratado menor al esperado', '<span class="chip-c pres">Existencial</span>', 'No comprar flotilla sin 3 años de visibilidad. Arrendamiento con plazo igual al contrato, nunca mayor.'],
      ['Cambio de administración', '<span class="chip-c pres">Alta</span>', 'Contratos plurianuales blindados; diversificar entre estado, municipios y privados; que el estándar sea de la dependencia y no tuyo.'],
      ['Pago tardío del cliente público', '<span class="chip-c pres">Alta y crónica</span>', 'Línea de capital de trabajo dimensionada a 120 días de operación. Es el riesgo que más constructoras mata en México.'],
      ['Desempeño del pavimento bajo garantía', '<span class="chip-c neg">Media</span>', 'Se controla con la especificación, el tramo de prueba y el laboratorio independiente. La telemetría avisa antes de que sea caro.'],
      ['Precio de cemento, acero y diésel', '<span class="chip-c neg">Media</span>', 'Cláusulas de escalación en obra, indexación en la anualidad y contratos de suministro anuales.'],
      ['Falta de gente calificada', '<span class="chip-c neg">Media</span>', 'Formar en lugar de competir por sueldo; continuidad de trabajo como argumento; certificaciones propias.'],
      ['Falla de una máquina crítica', '<span class="chip-c alto">Baja pero cara</span>', 'Mantenimiento por horas, refacciones en sitio, contrato de servicio con el fabricante y plan escrito por máquina.'],
      ['Liberación de derecho de vía', '<span class="chip-c pres">Alta</span>', 'Puesto dedicado con reporte directo y 20 km de colchón permanente.'],
    ])}
    ${citaDoc('El riesgo que no está en la tabla, y el más probable: ganar un contrato con un precio que no permite construir así. Es el único que destruye el modelo completo, porque un pavimento al 70 % de la especificación no aguanta la anualidad de 30 años y se pierden la obra y la conservación a la vez. La defensa es una política escrita y decidida en frío: hay un piso de precio debajo del cual no se firma, aunque se pierda el contrato.', true)}

    ${h2Doc('n-angulos', 'Para que nada nos tome por sorpresa', 'Todos los ángulos')}
    ${tablaDoc(['Ángulo', 'La pregunta', 'La respuesta'], [
      ['Cliente', '¿Quién paga?', 'SICT y estados por obra pública; concesionarios y APP por disponibilidad; parques industriales y privados para accesos y patios. Nunca más de la mitad del volumen con un solo cliente.'],
      ['Contrato', '¿Bajo qué figura?', 'Obra pública con conservación plurianual, APP por disponibilidad o contrato privado. Siempre con desempeño medido (IRI, grietas, drenes) y ventana de revisión cada 5 años.'],
      ['Precio', '¿Cómo no perder dinero?', 'Cotizador con cantidades reales, indexación y un piso que no se cruza.'],
      ['Cobro', '¿Cuándo entra el dinero?', 'Anticipo, estimaciones quincenales y factoraje. El pago tardío se presupuesta desde el inicio: 120 días.'],
      ['Gente', '¿Quién lo hace bien de noche?', 'Sueldos arriba del mercado, variable con candado de calidad, bienestar real y continuidad de varios años.'],
      ['Calidad', '¿Quién garantiza los 50 años?', 'Calidad reporta al Director, laboratorio con autoridad de rechazo y bonos de dirección diferidos hasta el año 5.'],
      ['Seguridad', '¿Qué pasa en un frente nocturno abierto?', 'Señalización completa, cualquiera para el colado sin consecuencias y 10 % del variable atado a cero accidentes.'],
      ['Fiscal', '¿Qué impuestos pesan?', 'IVA acreditable de materiales y flotilla, depreciación de la maquinaria, reparto de utilidades de ley y nómina bien timbrada. Sin atajos.'],
      ['Cumplimiento', '¿Cómo se gana sin corrupción?', 'Licitaciones limpias, política anticorrupción firmada por todos, bitácora digital y datos del tablero abiertos al cliente. El estándar publicado es la mejor defensa.'],
      ['Ambiental', '¿Qué huella deja?', 'La ceniza volante sustituye 20–25 % del cemento, la parte que más CO₂ emite. Construir una vez evita tres o cuatro reconstrucciones. Manifestación de impacto ambiental antes de liberar.'],
      ['Social', '¿Cómo se lleva con las comunidades?', 'Empleo local en las cuadrillas, liberaciones con trato directo y cabezas de dren visibles. Una carretera bien hecha es la mejor relación con el pueblo que la usa.'],
      ['Tecnología', '¿Qué se mide?', 'Sensores de madurez, control 3D, GPS de camiones y el tablero diario. El historial medido es la ventaja que no se copia.'],
      ['Político', '¿Y si cambia la administración?', 'Contratos plurianuales, clientes diversos y un estándar que adopta la dependencia, no la empresa.'],
      ['Escala', '¿Cómo se crece?', 'Clonando frentes desde el otro extremo del corredor, nunca acelerando uno. Cada frente nuevo arranca en 16 semanas.'],
      ['Valor', '¿Cuánto vale la empresa?', 'Una constructora vale por su obra; una empresa con 30 años de anualidades firmadas vale por su flujo. La conservación multiplica el valor.'],
    ])}

    ${h2Doc('n-doce', 'De cero a flotilla operando, sin comprometer la empresa', 'Los primeros 12 meses')}
    ${tablaDoc(['Mes', 'Qué se hace', 'Qué se gasta'], [
      ['1–2', 'Publicar el estándar. Presentarlo a dependencias y colegios de ingenieros. Buscar el primer corredor candidato.', 'Casi nada'],
      ['2–4', 'Montar laboratorio y equipo técnico core: gerente de calidad, jefe de laboratorio, ingeniero de datos. Empezar a vender supervisión y diseño a obras de terceros.', 'Bajo, y ya genera ingreso'],
      ['3–5', 'Bancos de caliza: identificar, ensayar y asegurar reservas con contrato antes de que alguien más vea su valor.', 'Medio'],
      ['5–7', 'Tramo de prueba de 500 m con tres variantes instrumentadas: la carta de presentación comercial y el entrenamiento del equipo.', 'Medio'],
      ['6–8', 'Con el tramo medido: negociar el primer corredor y su contrato de conservación en el mismo paquete.', '—'],
      ['8–10', 'Cerrado el contrato: arrendamiento de la flotilla, contratación de los cuatro operadores críticos, montaje de planta.', 'Alto, ya contra contrato'],
      ['10–12', 'Movilización completa y arranque a ritmo parcial.', 'Operativo'],
    ], ['num', '', ''])}
    <div class="dcards">
      ${tarjeta('<i>1</i>Publicar el estándar primero', 'Antes de tener flotilla y antes de tener contrato.', 'Cuesta casi nada y posiciona como quien sabe cómo se hace: el argumento de venta más fuerte que se va a tener.')}
      ${tarjeta('<i>2</i>Asegurar la caliza temprano', 'El agregado correcto es el insumo estratégico de toda la especificación.', 'Un banco con reservas contratadas es una ventaja física que no se copia con dinero rápido.')}
      ${tarjeta('<i>3</i>Obra y conservación juntas, nunca por separado', 'Si primero se firma la obra y luego se intenta vender la conservación, ya se perdió la palanca.', 'Van en el mismo paquete o el modelo se queda en construcción tradicional.')}
    </div>
    ${citaDoc('No se compra una sola máquina antes de tener firmado el contrato que la usa. La única excepción deliberada son el laboratorio y el tramo de prueba, que se pagan antes precisamente porque son lo que hace ganar el contrato.')}
  </div>`;
